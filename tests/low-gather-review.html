<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>全身低物采集候选</title><style>html,body{margin:0;height:100%;font:12px system-ui;background:#23332b;color:white}body{display:flex;flex-direction:column}nav{padding:5px}output{height:85px;overflow:auto;overflow-wrap:anywhere}canvas{flex:1;min-height:0;width:100%}button,select{padding:5px}</style>
<nav>声明真实节点/近距fixture · 无存档、无声音 <select id="kind"><option>fiber</option><option>berry</option><option>shell</option></select><select id="distance"><option value="1">1米可触及候选</option><option value="2.7">2.7米规则内但超出手臂</option></select><button id="reset" disabled>重置</button><button id="half" disabled>真实采集到命中定格</button><button id="end" disabled>完成回收</button></nav><output>准备…</output><canvas></canvas>
<script type="module">
import * as T from '../vendor/three.module.min.js';import {loadAuthoredCast} from '../src/authored-assets.js';import {authorSolePoints} from '../src/authored-character.js';import {WorldView} from '../src/scene.js';import {createWorld,terrain} from '../src/world.js';import {freshGame,nearest,interact,resolveGather,tick} from '../src/game.js';
const world=createWorld(),canvas=document.querySelector('canvas'),out=document.querySelector('output'),view=new WorldView(canvas,world),rows=[],files=['src/authored-character.js','src/main.js','src/scene.js'];const sources=Object.fromEntries(await Promise.all(files.map(async path=>[path,Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',await(await fetch('../'+path,{cache:'no-store'})).arrayBuffer())),b=>b.toString(16).padStart(2,'0')).join('')])));let state,target,pending,frames=0,running=false,events=[],soleError=0;
function draw(dt=0){view.draw(state,nearest(state,world.objects),null,false,dt);const actor=view.player,rig=actor.userData,wrist=actor.getObjectByName('hand_r').getWorldPosition(new T.Vector3()),pelvis=actor.getObjectByName('pelvis').getWorldPosition(new T.Vector3());for(const [j,p]of authorSolePoints(actor).entries())soleError=Math.max(soleError,p.distanceTo(rig.worldFeet[j]));const row={frames,time:state.time,running,kind:target.type,target,player:{...state.player},inventory:{...state.inventory},events,action:rig.actionSource,wrist:wrist.toArray(),pelvis:pelvis.toArray(),wristTargetError:wrist.distanceTo(new T.Vector3(target.x,terrain(target.x,target.z)+.35,target.z)),soleError,buffer:[canvas.width,canvas.height],viewport:[innerWidth,innerHeight],glError:view.renderer.getContext().getError(),sources,scope:'Real world node / production interact-resolve-tick-draw; fixed .01 game seconds per rAF, declared location/quest6/axe and enemies disabled. Hand target is terrain+.35 proxy, not exact plant mesh. No normal save/main-loop input, audition/device/GPU/long run/final quality.'};out.textContent=JSON.stringify(row);}
function reset(){const kind=document.querySelector('#kind').value,distance=Number(document.querySelector('#distance').value);state=freshGame();state.time=240;state.quest=6;state.inventory.axe=1;state.selected='axe';state.enemies.forEach(e=>e.hp=0);target=world.objects.filter(o=>o.type===kind&&terrain(o.x,o.z)>.5).sort((a,b)=>Math.hypot(a.x-136,a.z+22)-Math.hypot(b.x-136,b.z+22)).find(o=>{Object.assign(state.player,{x:o.x,z:o.z+distance,yaw:Math.PI});return terrain(state.player.x,state.player.z)>.15&&nearest(state,world.objects)?.id===o.id;});if(!target)throw Error('No real reachable node');pending=null;frames=soleError=0;events=[];view.sync(state);view.player.userData.lastPosition=null;view.gatherAt=-100;view.yaw=.75;view.pitch=.15;view.distance=7;view.camera.position.set(state.player.x+5,terrain(state.player.x,state.player.z)+4,state.player.z+5);view.resize();for(let i=0;i<60;i++)draw(1/60);document.querySelector('#half').disabled=false;document.querySelector('#end').disabled=true;draw();}
function advance(stop){if(running)return;if(!pending&&frames===0){const result=interact(state,target,{defer:true});if(!result?.pending)throw Error(String(result));pending=result.pending;view.gatherAt=pending.at;view.gatherKind=target.type;view.gatherTool='hand';view.gatherTarget={x:target.x,z:target.z,y:terrain(target.x,target.z)+.35};}running=true;document.querySelectorAll('button,select').forEach(e=>e.disabled=true);function frame(){tick(state,.01,false,null,world.objects);state.time=240+(frames+1)*.01;if(pending&&state.time>=pending.at+.21){const result=resolveGather(state,pending);events.push({at:state.time,message:result});pending=null;view.sync(state);}frames++;draw(.01);if(frames<stop)requestAnimationFrame(frame);else{running=false;document.querySelectorAll('button,select').forEach(e=>e.disabled=false);document.querySelector('#half').disabled=true;draw(0);}}requestAnimationFrame(frame);}
document.querySelector('#reset').onclick=reset;document.querySelector('#half').onclick=()=>advance(21);document.querySelector('#end').onclick=()=>advance(45);
Promise.all([loadAuthoredCast().then(c=>view.installAuthoredCast(c)),view.groundSurface.userData.ground.loaded,view.groundSurface.userData.ground.sand.loaded,view.rockSurface.userData.rock.loaded]).then(()=>{reset();document.querySelectorAll('button,select').forEach(e=>e.disabled=false);document.querySelector('#end').disabled=true;}).catch(e=>{out.textContent=String(e);console.error(e)});
addEventListener('pagehide',()=>{view.authoredCast?.release();view.impacts.dispose();});
</script></html>

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>敌人反馈生产界面隔离验收</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}output{position:fixed;bottom:0;left:0;right:0;max-height:90px;overflow:auto;background:white;color:#111;font:10px monospace;z-index:100;pointer-events:none}</style><iframe title="显式近身敌人 fixture 的生产界面"></iframe><output>显式敌人/位置/斧 fixture；专用存档键，不操作普通档。原生输入由受控浏览器执行。</output><script type="module">
const type=new URL(location.href).searchParams.get('type')==='crab'?'crab':'boar';
const response=await fetch('../index.html');if(!response.ok)throw new Error('index HTTP '+response.status);const doc=new DOMParser().parseFromString(await response.text(),'text/html'),base=doc.createElement('base');base.href=new URL('../',location.href).href;doc.head.prepend(base);doc.body.dataset.testHarness='true';for(const script of doc.querySelectorAll('script'))script.remove();
const setup=doc.createElement('script');setup.type='module';setup.textContent=`
import {boot} from './src/main.js';import {freshGame} from './src/game.js';import {GameAudio} from './src/audio.js';
const state=freshGame();state.time=240;state.quest=6;state.inventory.axe=1;state.selected='axe';state.enemies.forEach(e=>e.hp=0);Object.assign(state.enemies[0],{type:${JSON.stringify(type)},x:-70,z:104.55,hp:70,attackAt:-100});
const records=[],cues=[],effect=GameAudio.prototype.effect;GameAudio.prototype.effect=function(kind,options){cues.push({kind,at:performance.now(),options});if(cues.length>100)cues.shift();return effect.call(this,kind,options);};
let previous='';const sample=()=>{const hp=document.querySelector('#hp-value').textContent,hint=document.querySelector('#enemy-hint').textContent,danger=document.querySelector('#enemy-status').dataset.danger,combat=document.querySelector('#combat-feedback'),row={at:performance.now(),hp,enemyHp:document.querySelector('#enemy-hp-value').textContent,hint,danger,combat:combat.hidden?'':combat.textContent,paused:document.querySelector('#panel').open};const key=JSON.stringify({...row,at:0});if(key!==previous){previous=key;records.push(row);if(records.length>100)records.shift();}parent.document.querySelector('output').textContent=JSON.stringify({type:${JSON.stringify(type)},records,cues,scope:'Production boot, native UI input; explicit enemy/weapon/position fixture, separate QA storage. Cue calls are not listening proof.'});};
new MutationObserver(sample).observe(document.body,{subtree:true,childList:true,attributes:true,characterData:true});
boot({initialState:state,storageKey:'tidelands-qa-enemy-windup-${type}'});
`;doc.body.append(setup);document.querySelector('iframe').srcdoc='<!doctype html>'+doc.documentElement.outerHTML;
</script></html>

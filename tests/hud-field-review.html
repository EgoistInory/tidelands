<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>探索HUD视野与交互核验</title>
<style>html,body,iframe{margin:0;width:100%;height:100%;border:0}#result{position:fixed;left:0;top:0;max-width:380px;max-height:0;overflow:hidden;pointer-events:none}</style>
<output id="result">准备生产HUD…</output><iframe title="生产探索HUD隔离验收"></iframe>
<script type="module">
const mode=new URL(location.href).searchParams.get('mode')??'journey';if(!['journey','freeplay','combat'].includes(mode))throw Error('Unknown HUD fixture');const response=await fetch('../index.html',{cache:'no-store'}),doc=new DOMParser().parseFromString(await response.text(),'text/html'),base=doc.createElement('base');base.href=new URL('../',location.href).href;doc.head.prepend(base);doc.body.dataset.testHarness='true';for(const script of doc.querySelectorAll('script'))script.remove();
const setup=doc.createElement('script');setup.type='module';setup.textContent=`
import {boot} from './src/main.js';import {freshGame} from './src/game.js';import {WorldView} from './src/scene.js';
const mode=${JSON.stringify(mode)},state=freshGame();state.quest=mode==='journey'?0:6;state.time=240;state.enemies.forEach(e=>e.hp=0);if(mode==='combat'){const e=state.enemies.find(e=>e.type==='boar');Object.assign(e,{x:state.player.x+2.6,z:state.player.z,hp:40,attackAt:state.time});state.player.yaw=Math.PI/2;}if(mode==='freeplay'){Object.assign(state.player,{x:-56,z:54});state.buildings=[{id:'hud-fire',type:'campfire',x:-56,z:56},{id:'hud-tent',type:'tent',x:-65,z:49},{id:'hud-bench',type:'workbench',x:-47,z:49}];}
const files=['styles.css','index.html','src/main.js','src/scene.js'],sources=Object.fromEntries(await Promise.all(files.map(async path=>{const bytes=await(await fetch('./'+path,{cache:'no-store'})).arrayBuffer();return [path,Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),b=>b.toString(16).padStart(2,'0')).join('')];})));
const selectors=['.vitals','.quest','.map-corner','.hotbar','#enemy-status','#toast','.bottom-right','#joystick','#attack-button','#interact-button','#map-button','#pause-button'];let frames=0;
const draw=WorldView.prototype.draw;WorldView.prototype.draw=function(...args){const r=draw.apply(this,args);if(++frames%15)return r;const rects={};for(const selector of selectors){const e=document.querySelector(selector),s=getComputedStyle(e),b=e.getBoundingClientRect();rects[selector]={x:b.x,y:b.y,width:b.width,height:b.height,bottom:b.bottom,right:b.right,visible:s.display!=='none'&&s.visibility!=='hidden'&&b.width>0&&b.height>0,text:e.innerText??'',scrollWidth:e.scrollWidth,clientWidth:e.clientWidth};}parent.document.querySelector('#result').textContent=JSON.stringify({mode,sources,frames,quest:state.quest,hp:state.player.hp,time:state.time,position:[state.player.x,state.player.z],camera:this.camera.position.toArray(),viewport:[innerWidth,innerHeight],buffer:[this.canvas.width,this.canvas.height],rects,glError:this.renderer.getContext().getError(),scope:'Actual production HUD/main with declared quest/start/camp or nearby enemy and isolated key. CSS view/controls evidence, not ordinary campaign, final art, performance or physical touch device.'});return r;};
boot({initialState:state,storageKey:'tidelands-qa-hud-field-'+mode});
`;doc.body.append(setup);document.querySelector('iframe').srcdoc='<!doctype html>'+doc.documentElement.outerHTML;
</script></html>

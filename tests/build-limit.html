<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>500建筑边界生产入口验收</title>
<style>html,body,iframe{margin:0;width:100%;height:100%;border:0}output{position:fixed;bottom:0;left:0;max-height:110px;overflow:auto;background:white;color:#111;font:11px monospace;z-index:100;pointer-events:none;overflow-wrap:anywhere}</style>
<iframe title="生产建造入口；明确499建筑材料fixture实际导入"></iframe><output id="result">独立存档键；499/500建筑材料fixture，非普通旅程。</output>
<script type="module">
const response=await fetch('../index.html');if(!response.ok)throw new Error('index HTTP '+response.status);
const doc=new DOMParser().parseFromString(await response.text(),'text/html'),base=doc.createElement('base');base.href=new URL('../',location.href).href;doc.head.prepend(base);
doc.body.dataset.testHarness='true';
for(const script of doc.querySelectorAll('script'))script.remove();
const setup=doc.createElement('script');setup.type='module';setup.textContent=`
  import {boot} from './src/main.js';import {WorldView} from './src/scene.js';
  const draw=WorldView.prototype.draw,seen=new Set();let last=0;
  WorldView.prototype.draw=function(state,...args){
    seen.add(this);draw.call(this,state,...args);
    if(performance.now()-last<100)return;last=performance.now();
    parent.document.querySelector('#result').textContent=JSON.stringify({
      viewCount:seen.size,buildingCount:state.buildings.length,lastBuilding:state.buildings.at(-1),
      inventory:state.inventory,position:[state.player.x,state.player.z],quest:state.quest,respawn:state.respawn,
      glError:this.renderer.getContext().getError(),viewport:[innerWidth,innerHeight],
      scope:'Actual production UI; imported count/material fixture. No runtime state edits or normal-playthrough claim.'
    });
  };
  boot({storageKey:'tidelands-qa-build-limit-oct12-0451'});
`;doc.body.append(setup);document.querySelector('iframe').srcdoc='<!doctype html>'+doc.documentElement.outerHTML;
</script></html>

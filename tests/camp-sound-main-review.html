<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>生产营地昼夜声场检视</title>
<style>html,body,iframe{width:100%;height:100%;margin:0;border:0}#result{position:fixed;left:0;top:0;background:#fff;color:#111;max-width:380px;max-height:90px;overflow:auto;font:10px monospace;z-index:100;pointer-events:none}</style>
<output id="result">准备生产营地fixture…</output><iframe title="生产营地隔离验收"></iframe>
<script type="module">
const mode=new URL(location.href).searchParams.get('mode')??'night',response=await fetch('../index.html',{cache:'no-store'}),doc=new DOMParser().parseFromString(await response.text(),'text/html'),base=doc.createElement('base');base.href=new URL('../',location.href).href;doc.head.prepend(base);doc.body.dataset.testHarness='true';for(const s of doc.querySelectorAll('script'))s.remove();
const setup=doc.createElement('script');setup.type='module';setup.textContent=`
import {boot} from './src/main.js';import {freshGame,nearest} from './src/game.js';import {createWorld,terrain} from './src/world.js';import {WorldView} from './src/scene.js';import {GameAudio} from './src/audio.js';
const files=['src/audio.js','src/main.js','src/scene.js','src/campfire.js'],sources=Object.fromEntries(await Promise.all(files.map(async path=>{const bytes=await(await fetch('./'+path,{cache:'no-store'})).arrayBuffer();return [path,Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),b=>b.toString(16).padStart(2,'0')).join('')];})));
const state=freshGame(),world=createWorld(),mode=${JSON.stringify(mode)};state.quest=6;state.time=mode==='day'?240:0;state.enemies.forEach(e=>e.hp=0);state.player.hp=63;
state.buildings=[{id:'sound-fire',type:'campfire',x:-56,z:56},{id:'sound-tent',type:'tent',x:-65,z:49},{id:'sound-bench',type:'workbench',x:-47,z:49}];
let found=false;for(const [dx,dz]of [[0,-2],[2,0],[-2,0],[0,2]]){Object.assign(state.player,{x:-56+dx,z:56+dz,yaw:Math.atan2(-dx,-dz)});if(terrain(state.player.x,state.player.z)>0&&nearest(state,world.objects)?.id==='sound-fire'){found=true;break;}}if(!found)throw Error('No actual camp rest entry');
let view=null,audio=null,worldInput=null,updates=0;const activation=[];
function report(){parent.document.querySelector('#result').textContent=JSON.stringify({ready:!!view,mode,sources,time:state.time,player:{...state.player},buildingCount:state.buildings.length,actualFireMeshes:view?[...view.buildings.values()].filter(g=>g.userData.flame).length:0,fireUniform:view?.buildings.get('sound-fire')?.userData.flame.material.uniforms.time.value,fireLight:view?.fireLight.intensity,updates,worldInput,active:audio?.active??false,enabled:audio?.enabled??true,fireGain:audio?.fire?.gain.value??0,pan:audio?.firePan?.pan.value??null,master:audio?.master?.gain.value??0,fireLoop:audio?.fireSource?.loop??false,fireBufferSeconds:audio?.fireSource?.buffer.duration??null,voices:audio?.sources.size??0,activation,paused:document.querySelector('#panel').open,viewport:[innerWidth,innerHeight],glError:view?.renderer.getContext().getError()??null,scope:'Real main start/rest/pause/resume UI and production audio/world inputs, declared three-building camp/q6/HP63 and disabled enemies; isolated storage key. No ordinary campaign, audition, device or GPU/endurance proof.'});}
const draw=WorldView.prototype.draw;WorldView.prototype.draw=function(...args){view=this;const r=draw.apply(this,args);report();return r;};
const update=GameAudio.prototype.update;GameAudio.prototype.update=function(...args){audio=this;updates++;worldInput=args[4]??null;const r=update.apply(this,args);report();return r;};
const active=GameAudio.prototype.setActive;GameAudio.prototype.setActive=function(value){audio=this;const r=active.call(this,value);activation.push({value,time:state.time});return r;};
boot({initialState:state,storageKey:'tidelands-qa-camp-sound-'+mode});
`;doc.body.append(setup);document.querySelector('iframe').srcdoc='<!doctype html>'+doc.documentElement.outerHTML;
</script></html>

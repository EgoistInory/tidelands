<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>两类生物支撑与摆腿审查</title><style>html,body{margin:0;height:100%;background:#182922;color:#eee;font:12px system-ui}body{display:flex;flex-direction:column}nav{padding:6px}output{height:110px;overflow:auto;overflow-wrap:anywhere}canvas{flex:1;min-height:0;width:100%}</style>
<nav>声明敌人/路径fixture · 无存档 <select id="region"><option value="coast">海岸</option><option value="forest">林地</option><option value="highland">高地</option><option value="shoal">浅滩</option></select><select id="type"><option value="boar">野猪</option><option value="crab">蟹</option></select><select id="path"><option value="script">360帧转向起停</option><option value="chase">180帧生产追击</option></select><button id="run" disabled>运行动作</button></nav>
<output>准备…</output><canvas aria-label="生产全身骨骼与实际地形，无存档诊断"></canvas><script type="module">
import * as THREE from '../vendor/three.module.min.js';import {WorldView} from '../src/scene.js';import {createWorld,terrain} from '../src/world.js';import {freshGame,tick} from '../src/game.js';
const world=createWorld(),canvas=document.querySelector('canvas'),view=new WorldView(canvas,world),out=document.querySelector('output'),run=document.querySelector('#run'),places={coast:[-110,70],forest:[95,-127],highland:[-51.26,-196.9],shoal:[107,193]},ground=view.scene.children.find(o=>o.geometry?.parameters?.width===800).geometry.attributes.position;
let state,frames,running=false,maxBank=0,rows=[],previous=null,maxSlide=0,maxGap=0,maxMeshGap=0,plantedSamples=0,swingSamples=0,moved=0,hits=0,hidden=false,intervals=[],last=null;
function meshHeight(x,z){const ix=Math.max(0,Math.min(319,Math.floor((x+400)/2.5))),iz=Math.max(0,Math.min(319,Math.floor((z+400)/2.5))),u=(x+400)/2.5-ix,v=(z+400)/2.5-iz,a=ground.getY(iz*321+ix),b=ground.getY(iz*321+ix+1),c=ground.getY((iz+1)*321+ix),d=ground.getY((iz+1)*321+ix+1);return u+v<=1?a+(b-a)*u+(c-a)*v:d+(c-d)*(1-u)+(b-d)*(1-v);}
function draw(){
  view.draw(state,null,null,false,1/60);const e=state.enemies[0],h=terrain(e.x,e.z),model=view.creatures.get(e.id),rig=model.userData;model.updateMatrixWorld(true);
  const feet=rig.contacts.map(c=>c.point.clone().applyMatrix4(c.leg.matrixWorld));
  if(running){maxBank=Math.max(maxBank,Math.abs(rig.body.rotation.z));feet.forEach((p,i)=>{if(rig.footContacts?.[i]){plantedSamples++;maxGap=Math.max(maxGap,Math.abs(p.y-terrain(p.x,p.z)));maxMeshGap=Math.max(maxMeshGap,Math.abs(p.y-meshHeight(p.x,p.z)));if(previous?.contacts[i])maxSlide=Math.max(maxSlide,Math.hypot(p.x-previous.feet[i].x,p.z-previous.feet[i].z));}else if(p.y-terrain(p.x,p.z)>.04)swingSamples++;});previous={feet,contacts:[...(rig.footContacts??[])]};if(frames%30===0)rows.push({frame:frames,position:[e.x,e.z],hp:state.player.hp,feet:feet.map(p=>p.toArray()),contacts:rig.footContacts,phase:rig.phase,body:rig.body.rotation.toArray(),motion:rig.bodyMotion});}
  view.camera.position.set(e.x+6,h+2.6,e.z+7);view.camera.lookAt(e.x,h+.8,e.z);view.sky.position.copy(view.camera.position);view.renderer.render(view.scene,view.camera);
  const sorted=[...intervals].sort((a,b)=>a-b);out.textContent=JSON.stringify({ready:true,region:document.querySelector('#region').value,type:e.type,path:document.querySelector('#path').value,frames,running,maxBank,hp:state.player.hp,moved,hits,maxSlide,maxGap,maxMeshGap,plantedSamples,swingSamples,hidden,raf:sorted.length?{samples:sorted.length,p95:sorted[Math.floor(sorted.length*.95)],max:sorted.at(-1)}:null,feet:feet.map(p=>p.toArray()),contacts:rig.footContacts,rows,viewport:[innerWidth,innerHeight],buffer:[canvas.width,canvas.height],glError:view.renderer.getContext().getError(),scope:'Declared kinematic 360-frame turn/stop/restart OR production tick180 chase fixture. Actual articulated contact transforms versus analytic terrain and current mesh vertex interpolation. Not ordinary campaign,all sole geometry,natural gait,GPU,long run or real device.'});
}
function reset(){const [x,z]=places[document.querySelector('#region').value];state=freshGame();state.quest=6;state.time=240;state.enemies=[{id:'foot-review',type:document.querySelector('#type').value,x,z,hp:70,attackAt:-100}];Object.assign(state.player,{x:x+8,z:z+2});frames=0;running=false;maxBank=0;rows=[];previous=null;maxSlide=maxGap=maxMeshGap=plantedSamples=swingSamples=moved=hits=0;intervals=[];last=null;hidden=false;view.sync(state);for(let i=0;i<30;i++)draw();}
run.onclick=()=>{running=true;document.querySelectorAll('select,button').forEach(s=>s.disabled=true);function step(now){hidden||=document.hidden;if(last!==null)intervals.push(now-last);last=now;const e=state.enemies[0],before={x:e.x,z:e.z},hp=state.player.hp;
  if(document.querySelector('#path').value==='chase')tick(state,1/60,false,null,world.objects);
  else{state.time+=1/60;const speed=e.type==='boar'?4.2:2.5,angle=frames<120?0:Math.PI/2;if(frames<180||frames>=240){e.x+=Math.sin(angle)*speed/60;e.z+=Math.cos(angle)*speed/60;}Object.assign(state.player,{x:e.x+Math.sin(angle)*100,z:e.z+Math.cos(angle)*100});}
  moved+=Math.hypot(e.x-before.x,e.z-before.z);hits+=Number(state.player.hp<hp);frames++;view.sync(state);draw();const end=document.querySelector('#path').value==='chase'?180:360;if(frames<end)requestAnimationFrame(step);else{running=false;draw();document.querySelectorAll('select,button').forEach(s=>s.disabled=false);}}requestAnimationFrame(step);};
for(const s of document.querySelectorAll('select'))s.onchange=reset;Promise.all([view.groundSurface.userData.ground.loaded,view.rockSurface.userData.rock.loaded]).then(()=>{reset();run.disabled=false;});window.addEventListener('resize',()=>{view.resize();if(state)draw();});window.addEventListener('pagehide',()=>{view.contactShade.dispose();view.renderer.dispose();});
</script></html>

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>四岛区域地貌 · 同镜头验收</title>
<style>html,body{margin:0;height:100%;background:#192723;color:#eee;font:13px system-ui}body{display:flex;flex-direction:column}nav{padding:6px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}select,button{font:inherit;padding:5px}output{height:52px;overflow:auto;overflow-wrap:anywhere;font:10px monospace}canvas{flex:1;min-height:0;width:100%;display:block}</style>
<nav>四岛同镜头 · 无存档的声明fixture <select id="site"><option value="coast">潮汐海岸</option><option value="forest">苍翠林地</option><option value="highland">雾岬高地</option><option value="shoal">琥珀浅滩</option></select><select id="distance"><option value="middle">中景</option><option value="near">近景</option><option value="far">远景</option></select><button id="move" disabled>生产移动与转向6秒</button><span id="status">准备作者场景…</span></nav><output id="result"></output><canvas aria-label="完整作者场景的区域地貌对照"></canvas>
<script type="module">
import * as THREE from '../vendor/three.module.min.js';
import {WorldView} from '../src/scene.js';
import {createWorld,terrain} from '../src/world.js';
import {freshGame,movePlayer,tick,serialize,nearest} from '../src/game.js';
import {loadAuthoredCast} from '../src/authored-assets.js';
import {loadWoodlandDressing} from '../src/woodland.js';
import {prepareCoastalVisual,bindCoastalVisual} from '../src/coastal.js';
import {prepareInlandVisual,bindInlandVisual} from '../src/inland.js';
import {prepareSurfaceTextures} from '../src/startup-textures.js';
import {updateGroundCover} from '../src/meadow.js';
const world=createWorld(),originalWorld=JSON.stringify(world),view=new WorldView(document.querySelector('canvas'),world),output=document.querySelector('#result'),status=document.querySelector('#status');
const sites={coast:[-130,20],forest:[164.4377,-108.4654],highland:[-41.4534111,-208.3750763],shoal:[170,160]},offsets={near:[7,6,8],middle:[25,18,28],far:[85,65,95]};
let state,camera,look,saved,motion=null,running=false;
const gl=view.renderer.getContext(),debug=gl.getExtension('WEBGL_debug_renderer_info');
function snapshot(){return {ready:true,site:document.querySelector('#site').value,distance:document.querySelector('#distance').value,position:[state.player.x,state.player.z],height:terrain(state.player.x,state.player.z),camera:view.camera.position.toArray(),lookAt:look.toArray(),time:state.time,viewport:[innerWidth,innerHeight],buffer:[view.canvas.width,view.canvas.height],worldUnchanged:JSON.stringify(world)===originalWorld,stateUnchanged:serialize(state)===saved,authored:{cast:!!view.authoredCast,woodland:!!view.woodlandDressing,coastal:!!view.coastal,inland:!!view.inland},render:{calls:view.renderer.info.render.calls,triangles:view.renderer.info.render.triangles},renderer:debug?gl.getParameter(debug.UNMASKED_RENDERER_WEBGL):null,glError:gl.getError(),motion,running,scope:'Declared no-storage fixture; enemies inactive, quest6, fixed time and identical comparison camera. Not ordinary gameplay, GPU timing, long-duration or device proof.'};}
function fixedDraw(){view.camera.position.copy(camera);view.camera.lookAt(look);view.sky.position.copy(camera);view.coastal.update(state);view.inland.update(state);updateGroundCover(view.meadow,camera);view.renderer.render(view.scene,view.camera);output.textContent=JSON.stringify(snapshot());}
function reset(site=document.querySelector('#site').value,distance=document.querySelector('#distance').value,height=null){document.querySelector('#site').value=site;document.querySelector('#distance').value=distance;const [x,z]=sites[site],h=height??terrain(x,z),offset=offsets[distance];state=freshGame();Object.assign(state.player,{x,z,yaw:0});state.enemies.forEach(e=>e.hp=0);state.time=240;state.quest=6;motion=null;view.player.userData.lastPosition=null;view.player.userData.worldFeet=null;view.sync(state);view.draw(state,null,null,false,1/60);camera=new THREE.Vector3(x+offset[0],h+offset[1],z+offset[2]);look=new THREE.Vector3(x,h+1,z);saved=serialize(state);fixedDraw();return snapshot();}
function move(){if(running)return;running=true;document.querySelectorAll('button,select').forEach(s=>s.disabled=true);let frames=0,distance=0,last=null;const intervals=[];const start=[state.player.x,state.player.z];motion={complete:false,frames:0,start};return new Promise(resolve=>{function frame(now){if(last!==null)intervals.push(now-last);last=now;const {x,z}=state.player;movePlayer(state,world.objects,frames<180?0:1,frames<180?-1:0,1/60,false);distance+=Math.hypot(state.player.x-x,state.player.z-z);tick(state,1/60,false,null,world.objects);view.sync(state);view.draw(state,nearest(state,world.objects),null,true,1/60);frames++;if(frames<360){requestAnimationFrame(frame);return;}running=false;const sorted=intervals.sort((a,b)=>a-b);motion={complete:true,frames,start,end:[state.player.x,state.player.z],distance,simulationSeconds:6,rafMs:{median:sorted[Math.floor(sorted.length*.5)],p95:sorted[Math.floor(sorted.length*.95)],max:sorted.at(-1)},hidden:document.hidden};saved=serialize(state);look.set(state.player.x,terrain(state.player.x,state.player.z)+1,state.player.z);output.textContent=JSON.stringify(snapshot());document.querySelectorAll('button,select').forEach(s=>s.disabled=false);resolve(snapshot());}requestAnimationFrame(frame);});}
document.querySelector('#move').onclick=move;document.querySelectorAll('select').forEach(s=>s.onchange=()=>reset());
await prepareSurfaceTextures([view.groundSurface.userData.ground,view.groundSurface.userData.ground.sand,view.rockSurface.userData.rock],view.renderer);
view.installAuthoredCast(await loadAuthoredCast());view.installWoodlandDressing(await loadWoodlandDressing(world.objects));view.coastal=bindCoastalVisual(view,await prepareCoastalVisual());view.inland=bindInlandVisual(view,await prepareInlandVisual({level:innerWidth<700?'mid':'near'}));
reset();status.textContent='作者场景已就绪';document.querySelector('#move').disabled=false;
window.regionalReview={reset,snapshot,move,sites};
window.addEventListener('resize',()=>{view.resize();if(state&&!running)fixedDraw();});
window.addEventListener('pagehide',()=>{view.inland?.release();view.coastal?.release();view.authoredCast?.release();view.woodlandDressing?.release();view.contactShade.dispose();view.impacts.dispose();view.renderer.dispose();});
</script></html>

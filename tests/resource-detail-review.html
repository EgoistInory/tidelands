<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>资源整组结构表面候选审查</title><style>html,body{margin:0;height:100%;background:#192723;color:#eee;font:13px system-ui}body{display:flex;flex-direction:column}nav{padding:7px;display:flex;gap:8px}button,select{font:inherit;padding:5px}output{height:85px;overflow:auto;overflow-wrap:anywhere}canvas{flex:1;min-height:0;width:100%}</style>
<nav>当前207世界/作者植被及人物，声明资源位置与时钟，无存档 <select id="type"><option value="berry">浆果灌丛</option><option value="crystal">晶簇</option></select><select id="variant"><option value="old">当前生产</option><option value="candidate">结构表面候选</option></select><select id="light"><option value="240">正午</option><option value="360">黄昏</option><option value="0">午夜</option></select><select id="distance"><option value="near">近距审查</option><option value="follow">实际跟随镜头</option></select><button id="gather" disabled>定格采集耗尽</button></nav><output>准备当前作者资产…</output><canvas aria-label="当前世界同镜头资源审查"></canvas>
<script type="module">
import * as THREE from '../vendor/three.module.min.js';import {WorldView} from './resource-detail-baseline-scene.js';import {createWorld,terrain} from '../src/world.js';import {freshGame,interact,isDepleted} from '../src/game.js';import {loadAuthoredCast} from '../src/authored-assets.js';import {loadWoodlandDressing} from '../src/woodland.js';import {prepareCoastalVisual,bindCoastalVisual} from '../src/coastal.js';import {prepareInlandVisual,bindInlandVisual} from '../src/inland.js';import {createBerryBush,createDetailedCrystal} from './resource-detail-candidate.js';
const world=createWorld(),frozen=JSON.stringify(world.objects),view=new WorldView(document.querySelector('canvas'),world),out=document.querySelector('output'),candidate=[],dummy=new THREE.Object3D();
for(const [type,make]of [['berry',createBerryBush],['crystal',createDetailedCrystal]]){const model=make(),entries=world.objects.filter(o=>o.type===type);model.updateMatrixWorld(true);for(const part of model.children){const batch=new THREE.InstancedMesh(part.geometry,part.material,entries.length);part.updateMatrix();for(let i=0;i<entries.length;i++){const o=entries[i];dummy.position.set(o.x,o.y,o.z);dummy.rotation.set(0,o.rotation,0);dummy.scale.setScalar(o.scale);dummy.updateMatrix();batch.setMatrixAt(i,dummy.matrix.clone().multiply(part.matrix));}batch.castShadow=batch.receiveShadow=true;batch.visible=false;batch.computeBoundingSphere();view.scene.add(batch);candidate.push({type,batch,entries,part:part.matrix.clone()});}}
view.installAuthoredCast(await loadAuthoredCast());view.installWoodlandDressing(await loadWoodlandDressing(world.objects));view.coastal=bindCoastalVisual(view,await prepareCoastalVisual());view.inland=bindInlandVisual(view,await prepareInlandVisual());
let state,node,draws=0;
function draw(){
  const type=document.querySelector('#type').value,newer=document.querySelector('#variant').value==='candidate';
  for(const b of view.batches)if(['berry','crystal'].includes(b.entries[0]?.type))b.batch.visible=!newer;
  for(const b of candidate){b.batch.visible=newer;for(let i=0;i<b.entries.length;i++){const o=b.entries[i];dummy.position.set(o.x,o.y,o.z);dummy.rotation.set(0,o.rotation,0);dummy.scale.setScalar(isDepleted(state,o)?0:o.scale);dummy.updateMatrix();b.batch.setMatrixAt(i,dummy.matrix.clone().multiply(b.part));}b.batch.instanceMatrix.needsUpdate=true;}
  view.sync(state);view.draw(state,node,null,false,1/60);if(document.querySelector('#distance').value==='near'){view.camera.position.set(node.x+4.2*node.scale,node.y+2.8*node.scale,node.z-4.8*node.scale);view.camera.lookAt(node.x,node.y+(type==='berry'?.8:1.3)*node.scale,node.z);view.sky.position.copy(view.camera.position);view.renderer.render(view.scene,view.camera);}draws++;
  out.textContent=JSON.stringify({ready:true,type,variant:document.querySelector('#variant').value,light:Number(document.querySelector('#light').value),distance:document.querySelector('#distance').value,node,inventory:state.inventory,depleted:isDepleted(state,node),worldUnchanged:JSON.stringify(world.objects)===frozen,authoredCast:!!view.authoredCast,inland:!!view.inland,coastal:!!view.coastal,draws,camera:view.camera.position.toArray(),viewport:[innerWidth,innerHeight],buffer:[view.canvas.width,view.canvas.height],render:{calls:view.renderer.info.render.calls,triangles:view.renderer.info.render.triangles,textures:view.renderer.info.memory.textures,geometries:view.renderer.info.memory.geometries},glError:view.renderer.getContext().getError(),scope:'Same current production world/cast/vegetation with explicit state and fixed close or production follow camera. Candidate resources only. No save, actual main-loop, GPU timing, physical-device or full-quality acceptance.'});
}
function reset(){state=freshGame();state.quest=6;state.enemies.forEach(e=>e.hp=0);state.inventory.axe=1;state.selected='axe';state.time=Number(document.querySelector('#light').value);const type=document.querySelector('#type').value;node=type==='berry'?world.objects.find(o=>o.id==='starter-2'):world.objects.find(o=>o.id===(new URLSearchParams(location.search).get('site')==='flat'?'resource-948':'resource-124'));Object.assign(state.player,{x:node.x,z:node.z-4,yaw:0});view.yaw=.15;view.pitch=.29;view.player.userData.lastPosition=null;view.camera.position.set(node.x+5,node.y+8,node.z+18);view.sync(state);for(let i=0;i<35;i++)draw();}
for(const s of document.querySelectorAll('select'))s.onchange=reset;document.querySelector('#gather').onclick=()=>{interact(state,node);draw();};
await Promise.all([view.groundSurface.userData.ground.loaded,view.groundSurface.userData.ground.sand.loaded,view.rockSurface.userData.rock.loaded]);reset();document.querySelector('#gather').disabled=false;
window.addEventListener('resize',()=>{view.resize();if(state)draw();});window.addEventListener('pagehide',()=>{view.inland.release();view.coastal.release();view.authoredCast.release();view.woodlandDressing.release();view.renderer.dispose();});
</script></html>

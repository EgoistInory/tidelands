<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>当前镜头连续性隔离审查</title>
<style>html,body{margin:0;height:100%;background:#192723;color:#efe6cf;font:13px system-ui}body{display:flex;flex-direction:column}nav{padding:6px;display:flex;gap:8px;flex-wrap:wrap}select,button{padding:6px;font:inherit}output{height:98px;overflow:auto;overflow-wrap:anywhere;font:10px monospace;padding:4px}canvas{flex:1;min-height:0;width:100%;display:block}</style>
<nav>明确位置/无敌人/营地fixture · 不读写浏览器存档
<label>区域<select id="route"><option value="coast">潮汐海岸</option><option value="forest">苍翠林地</option><option value="highland">雾岬高地</option><option value="shoal">琥珀浅滩</option><option value="camp">营地</option><option value="lamp">灯塔近障碍</option></select></label>
<label>昼夜<select id="time"><option value="240">正午</option><option value="0">午夜</option></select></label>
<button id="run" disabled>运行当前区域连续镜头</button></nav>
<output>准备生产世界…</output><canvas aria-label="声明位置的四岛与镜头验收画面"></canvas>
<script type="module">
import {WorldView} from '../src/scene.js';
import {createWorld,terrain} from '../src/world.js';
import {freshGame,movePlayer,tick,nearest} from '../src/game.js';
const world=createWorld(),view=new WorldView(document.querySelector('canvas'),world),output=document.querySelector('output'),button=document.querySelector('#run');
const routes={coast:{x:-90,z:20,yaw:1.5,pitch:.29},forest:{x:132,z:-45,yaw:.15,pitch:.29},highland:{x:-75,z:-235,yaw:1.7,pitch:.29},shoal:{x:145,z:180,yaw:2.5,pitch:.29},camp:{x:-70,z:102,yaw:.15,pitch:.29},lamp:{x:-86.9,z:-51.9,yaw:7*Math.PI/6,pitch:.08}};
let state,ready=false,row=null,initialIntentOverwriteDegrees=0;
function reset(){
 const p=routes[document.querySelector('#route').value];state=freshGame();state.enemies=[];state.quest=6;Object.assign(state.player,{x:p.x,z:p.z});state.time=Number(document.querySelector('#time').value);
 state.buildings=document.querySelector('#route').value==='camp'?[{id:'camera-qa-fire',type:'campfire',x:-75,z:105},{id:'camera-qa-tent',type:'tent',x:-76,z:114}]:[];
 view.sync(state);view.yaw=p.yaw;view.pitch=p.pitch;view.distance=14;view.camera.position.set(p.x+Math.sin(view.yaw)*14,terrain(p.x,p.z)+2.4+Math.tan(view.pitch)*14,p.z+Math.cos(view.yaw)*14);row=null;draw(false);
}
function draw(moving){
 const cpuStart=performance.now(),requestedYaw=view.yaw;view.draw(state,nearest(state,world.objects),null,moving,1/60);
 const error=Math.abs(Math.atan2(Math.sin(view.yaw-requestedYaw),Math.cos(view.yaw-requestedYaw)))*180/Math.PI;
 if(row){row.maxIntentOverwriteDegrees=Math.max(row.maxIntentOverwriteDegrees,error);row.frames++;}else initialIntentOverwriteDegrees=error;
 const p=state.player,c=view.camera.position,bearing=Math.atan2(c.x-p.x,c.z-p.z);
 if(row?.previousBearing!==undefined){const step=Math.abs(Math.atan2(Math.sin(bearing-row.previousBearing),Math.cos(bearing-row.previousBearing)))*180/Math.PI;row.maxRenderedBearingStepDegrees=Math.max(row.maxRenderedBearingStepDegrees,step);if(step>12&&row.jumpSamples.length<8)row.jumpSamples.push({frame:row.frames,stepDegrees:step,player:[p.x,p.z],camera:c.toArray(),previousCamera:row.previousCamera,focusDistance:c.distanceTo(view.player.position.clone().add({x:0,y:2.4,z:0}))});}
 if(row){const distance=c.distanceTo(view.player.position.clone().add({x:0,y:2.4,z:0}));row.minFocusDistance=Math.min(row.minFocusDistance,distance);if(row.previousDistance!==undefined)row.maxRadialStep=Math.max(row.maxRadialStep,Math.abs(distance-row.previousDistance));row.previousDistance=distance;row.maxDrawCpuMs=Math.max(row.maxDrawCpuMs,performance.now()-cpuStart);row.previousBearing=bearing;row.previousCamera=c.toArray();}
 output.textContent=JSON.stringify({ready,route:document.querySelector('#route').value,time:state.time,viewport:[innerWidth,innerHeight],player:[p.x,p.z],requestedYaw,resolvedRequestYaw:view.yaw,renderedBearing:bearing,initialIntentOverwriteDegrees,glError:view.renderer.getContext().getError(),row,scope:'Declared position/camp/quest6/no-enemies fixture; fixed-dt movement and manual orbit increments; no save/input/performance/full-quality acceptance.'});
}
for(const el of document.querySelectorAll('select'))el.onchange=reset;
button.onclick=()=>{button.disabled=true;row={minFocusDistance:Infinity,maxRadialStep:0,maxDrawCpuMs:0,frames:0,maxIntentOverwriteDegrees:initialIntentOverwriteDegrees,maxRenderedBearingStepDegrees:0,jumpSamples:[]};function step(){const f=row.frames;view.yaw+=f>=60&&f<120?.008:0;const v={x:Math.cos(view.yaw),z:-Math.sin(view.yaw)};movePlayer(state,world.objects,v.x,v.z,1/60,false);tick(state,1/60,false);draw(true);if(row.frames<180)requestAnimationFrame(step);else button.disabled=false;}requestAnimationFrame(step);};
Promise.all([view.groundSurface.userData.ground.loaded,view.groundSurface.userData.ground.sand.loaded,view.rockSurface.userData.rock.loaded]).then(()=>{ready=true;button.disabled=false;reset();});
window.addEventListener('resize',()=>{view.resize();if(state)draw(false);});window.addEventListener('pagehide',()=>view.renderer.dispose());
</script></html>

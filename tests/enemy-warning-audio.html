<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>敌人预警声离线验收</title><style>body{font:16px system-ui;padding:24px}pre{white-space:pre-wrap}button{padding:12px}</style><p>生产 GameAudio / OfflineAudioContext。波形验证不代表试听。</p><button id="render">渲染野猪与蟹的预警、命中及静音</button><pre id="result">尚未运行</pre><script type="module">
import {GameAudio} from '../src/audio.js';document.querySelector('button').onclick=async()=>{const reports=[];try{for(const mode of ['boar','crab','hit','paused','muted','busy']){const rate=48000,ctx=new OfflineAudioContext(1,rate,rate),adapter=new Proxy(ctx,{get(target,key){if(key==='state')return 'running';if(key==='resume'||key==='close')return async()=>{};const value=Reflect.get(target,key,target);return typeof value==='function'?value.bind(target):value;}}),audio=new GameAudio({contextFactory:()=>adapter});audio.setActive(true);await audio.unlock();for(const source of [audio.ambience,audio.surfSource,audio.birdsSource,audio.insectsSource])source.stop();audio.master.gain.setValueAtTime(.35,0);if(mode==='paused'){audio.setActive(false);audio.master.gain.setValueAtTime(0,0);}if(mode==='muted'){audio.setEnabled(false);audio.master.gain.setValueAtTime(0,0);}if(mode==='busy'){for(let i=0;i<30;i++)audio.effect('enemy-windup');for(const kind of ['quest','craft','food'])audio.effect(kind);}else audio.effect(mode==='hit'?'hit':'enemy-windup',{enemyType:mode});const queued=audio.sources.size,samples=(await ctx.startRendering()).getChannelData(0);let peak=0,energy=0;for(const x of samples){peak=Math.max(peak,Math.abs(x));energy+=x*x;}reports.push({mode,queued,peak,rms:Math.sqrt(energy/samples.length),finite:samples.every(Number.isFinite),unclipped:peak<1});await audio.dispose();}document.querySelector('#result').textContent=JSON.stringify(reports);}catch(e){document.querySelector('#result').textContent=e.stack;}};
</script></html>

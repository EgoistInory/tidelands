<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>角色与营地织物实景诊断</title>
<style>html,body{margin:0;height:100%;background:#192723;color:#eee7d4;font:13px system-ui}body{display:flex;flex-direction:column}nav{padding:6px;display:flex;gap:5px;flex-wrap:wrap}button,select{font:inherit;padding:6px}output{height:75px;overflow:auto;overflow-wrap:anywhere;font:11px monospace;padding:5px}canvas{flex:1;min-height:0;width:100%;display:block}</style>
<nav>明确营地/角色/移动fixture · 无敌人/存档
<label>画面<select id="subject"><option value="coat">衣服近景</option><option value="tent">帐篷近景</option><option value="camp">营地全景</option></select></label>
<label>光照<select id="time"><option value="240">正午</option><option value="0">午夜</option><option value="360">傍晚</option></select></label>
<button id="texture">切换织物/模拟单色</button><button id="angle">换方向</button><button id="motion">播放10秒移动</button></nav>
<output>等待地表贴图…</output><canvas aria-label="生产角色与帐篷的织物场景"></canvas>
<script type="module">
import * as THREE from '../vendor/three.module.min.js';
import {WorldView} from '../src/scene.js';
import {freshGame} from '../src/game.js';
import {createWorld,terrain} from '../src/world.js';
import {updateGroundCover} from '../src/meadow.js';
const state=freshGame(),view=new WorldView(document.querySelector('canvas'),createWorld());
state.enemies=[];state.time=240;state.buildings=[{id:'textile-tent',type:'tent',x:-74,z:105},{id:'textile-fire',type:'campfire',x:-70,z:107}];
view.sync(state);const originals=new Map(),flats=new Map(),members=[];
view.scene.traverse(mesh=>{if(mesh.isMesh&&mesh.material.userData.textile){
  const m=mesh.material;members.push(mesh);originals.set(mesh,m);
  if(!flats.has(m)){const flat=m.clone();flat.map=flat.bumpMap=null;flat.roughness=m.side===THREE.DoubleSide?1:.88;flats.set(m,flat);}
}});
let enabled=true,angle=0,stats=null,ready=false;
function draw(elapsed=0,dt=1/60,moving=false){
  for(const mesh of members)mesh.material=enabled?originals.get(mesh):flats.get(originals.get(mesh));
  const mode=document.querySelector('#subject').value,base=Number(document.querySelector('#time').value);
  state.time=base+elapsed;state.player.x=-70+(moving?Math.sin(elapsed*.8)*1.6:0);state.player.z=102;
  state.player.yaw=moving?(Math.cos(elapsed*.8)>=0?Math.PI/2:-Math.PI/2):0;
  if(!moving){view.player.userData.lastPosition=null;view.player.rotation.y=0;}
  view.draw(state,null,null,moving,dt);
  let x=state.player.x,z=state.player.z,y=terrain(x,z)+1.9,d=innerWidth<600?4.2:2.7;
  if(mode==='tent'){x=-74;z=105;y=terrain(x,z)+1.5;d=innerWidth<600?8:5.5;}
  if(mode==='camp'){x=-72;z=104;y=terrain(x,z)+1.4;d=innerWidth<600?16:11;}
  view.camera.position.set(x+Math.sin(angle+.35)*d,y+d*(mode==='coat'?.07:.45),z+Math.cos(angle+.35)*d);
  view.camera.lookAt(x,y,z);view.sky.position.copy(view.camera.position);updateGroundCover(view.meadow,view.camera.position);view.renderer.render(view.scene,view.camera);
}
function report(){const info=view.renderer.info,gl=view.renderer.getContext();document.querySelector('output').textContent=JSON.stringify({
  ready,enabled,subject:document.querySelector('#subject').value,time:state.time,angle,position:[state.player.x,state.player.z],
  textileMeshes:members.length,textileMaps:enabled?new Set(members.flatMap(m=>[m.material.map,m.material.bumpMap])).size:0,
  render:{calls:info.render.calls,triangles:info.render.triangles,geometries:info.memory.geometries,textures:info.memory.textures,programs:info.programs.length},
  viewport:[innerWidth,innerHeight],glError:gl.getError(),stats,note:'Production WorldView with declared camp and scripted movement fixture; off simulates prior flat cloth, no save. Dual draw is not gameplay GPU performance.'});}
function reset(){stats=null;draw();report();}
document.querySelector('#texture').onclick=()=>{enabled=!enabled;reset();};
document.querySelector('#angle').onclick=()=>{angle=(angle+Math.PI/2)%(Math.PI*2);reset();};
for(const input of document.querySelectorAll('select'))input.onchange=reset;
document.querySelector('#motion').onclick=()=>{
  const controls=[...document.querySelectorAll('button,select')];controls.forEach(c=>c.disabled=true);
  const frames=[];let start=null,last=null;stats={complete:false};
  function frame(now){start??=now;const elapsed=Math.min(10,(now-start)/1000),dt=last===null?0:(now-last)/1000;last=now;
    draw(elapsed,dt,true);frames.push({elapsed,dt,position:[state.player.x,state.player.z],textures:view.renderer.info.memory.textures,geometries:view.renderer.info.memory.geometries});
    if(elapsed<10)requestAnimationFrame(frame);else{
      const intervals=frames.slice(1).map(f=>f.dt*1000).sort((a,b)=>a-b);
      stats={complete:true,frames,elapsedMs:now-start,p95Ms:intervals[Math.floor(intervals.length*.95)],maxMs:Math.max(...intervals),over50ms:intervals.filter(v=>v>50).length,hidden:document.hidden};
      controls.forEach(c=>c.disabled=false);report();
    }
  }
  requestAnimationFrame(frame);
};
Promise.all([view.groundSurface.userData.ground.loaded,view.groundSurface.userData.ground.sand.loaded,view.rockSurface.userData.rock.loaded]).then(()=>{ready=true;reset();});
window.addEventListener('resize',()=>{view.resize();reset();});window.addEventListener('pagehide',()=>{for(const material of flats.values())material.dispose();view.renderer.dispose();});
</script></html>

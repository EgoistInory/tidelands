<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>空间声真实主循环隔离检查</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0}body{overflow:hidden}</style><iframe title="空间声隔离生产游戏"></iframe><script type="module">
const response=await fetch('../index.html',{cache:'no-store'});if(!response.ok)throw Error('index HTTP '+response.status);const doc=new DOMParser().parseFromString(await response.text(),'text/html'),base=doc.createElement('base');base.href=new URL('../',location.href).href;doc.head.prepend(base);doc.body.dataset.testHarness='true';for(const s of doc.querySelectorAll('script'))s.remove();const setup=doc.createElement('script');setup.type='module';setup.textContent=`
import {boot} from './src/main.js';import {freshGame} from './src/game.js';import {GameAudio} from './src/audio.js';import {WorldView} from './src/scene.js';
const out=document.createElement('pre');out.id='spatial-output';out.style.cssText='position:fixed;top:0;left:0;width:500px;max-height:145px;overflow:auto;z-index:100;background:#fff;color:#111;font:10px monospace;pointer-events:none';document.body.append(out);
const events=[],nodes=[];let audioRef=null,viewRef=null,stateRef=null;
const nativeContext=window.AudioContext;window.AudioContext=function(...args){const ctx=new nativeContext(...args),create=ctx.createStereoPanner.bind(ctx);ctx.createStereoPanner=()=>{const node=create(),entry={node,disconnected:false},disconnect=node.disconnect.bind(node);nodes.push(entry);node.disconnect=(...a)=>{entry.disconnected=true;return disconnect(...a);};return node;};return ctx;};
const draw=WorldView.prototype.draw;WorldView.prototype.draw=function(state,...args){viewRef=this;stateRef=state;return draw.call(this,state,...args);};
const effect=GameAudio.prototype.effect;GameAudio.prototype.effect=function(kind,options){audioRef=this;const before=this.sources.size,n=nodes.length;effect.call(this,kind,options);if(kind==='enemy-windup'){const e=stateRef.enemies.find(e=>e.hp>0);events.push({time:stateRef.time,options,before,after:this.sources.size,nativePanImmediately:nodes.length>n?nodes.at(-1).node.pan.value:null,player:{x:stateRef.player.x,z:stateRef.player.z,hp:stateRef.player.hp},enemy:e?{id:e.id,x:e.x,z:e.z}:null,camera:{x:viewRef.camera.position.x,z:viewRef.camera.position.z},context:this.context?.state??null});const row=events.at(-1),node=nodes.length>n?nodes.at(-1).node:null;setTimeout(()=>{row.nativePanAfter80ms=node?.pan.value??null;if(row.options.pan<-.5&&!document.getElementById('panel').open)document.getElementById('pause-button').click();},80);if(events.length>64)events.shift();}};
setInterval(()=>{out.textContent=JSON.stringify({fixture:'one nearby crab; production boot/tick/camera/input/audio, observation wrappers and auto-pause via UI after negative-pan cue; own storage, not ordinary campaign',events,nodes:nodes.length,disconnected:nodes.filter(n=>n.disconnected).length,voices:audioRef?.sources.size??0,active:audioRef?.active??false,enabled:audioRef?.enabled??true,context:audioRef?.context?.state??null,master:audioRef?.master?.gain.value??null,hp:stateRef?.player.hp??null,glError:viewRef?.renderer.getContext().getError()??null});},200);
const initialState=freshGame();initialState.enemies.forEach(e=>e.hp=0);Object.assign(initialState.enemies[0],{type:'crab',x:initialState.player.x+2.5,z:initialState.player.z,hp:40,attackAt:-100});boot({initialState,storageKey:'tidelands-qa-spatial-audio'});
`;doc.body.append(setup);document.querySelector('iframe').srcdoc='<!doctype html>'+doc.documentElement.outerHTML;
</script></html>

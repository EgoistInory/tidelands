<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>原生双声道预警审查</title><style>body{max-width:1000px;margin:24px auto;padding:12px;background:#edf0e6;color:#24362f;font:15px system-ui}button{padding:12px}pre{max-height:500px;overflow:auto;white-space:pre-wrap}audio{display:block;width:100%;margin:14px 0}</style><h1>原生双声道预警</h1><p>11秒48kHz OfflineAudioContext。声明左右/转镜/近远/暂停/菜单/静音/降级fixture；关闭背景声、固定同一噪声切片，隔离生产预警信号。不是完整混音、人工试听、真实游戏或真机证据。</p><button id="run">渲染并测量双声道</button><pre id="result">尚未运行</pre><div id="media"></div><script type="module">
import {GameAudio,enemySoundCue} from '../src/audio.js';
const out=document.querySelector('#result'),button=document.querySelector('#run');let url;
const stats=s=>{let sum=0,peak=0;for(const n of s){if(!Number.isFinite(n))throw Error('nonfinite sample');sum+=n*n;peak=Math.max(peak,Math.abs(n));}return {peak,rms:Math.sqrt(sum/s.length)};};
function wav(channels,rate){const count=channels[0].length,bytes=new ArrayBuffer(44+count*4),v=new DataView(bytes),word=(i,s)=>[...s].forEach((c,j)=>v.setUint8(i+j,c.charCodeAt(0)));word(0,'RIFF');v.setUint32(4,bytes.byteLength-8,true);word(8,'WAVE');word(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,2,true);v.setUint32(24,rate,true);v.setUint32(28,rate*4,true);v.setUint16(32,4,true);v.setUint16(34,16,true);word(36,'data');v.setUint32(40,count*4,true);for(let i=0;i<count;i++)for(let c=0;c<2;c++)v.setInt16(44+(i*2+c)*2,Math.round(Math.max(-1,Math.min(1,channels[c][i]))*32767),true);return new Blob([bytes],{type:'audio/wav'});}
button.onclick=async()=>{button.disabled=true;out.textContent='原生离线时钟渲染中…';try{
 const rate=48000,ctx=new OfflineAudioContext(2,rate*11,rate);let fallback=false,created=0,disconnected=0;
 const adapter=new Proxy(ctx,{get(target,key){if(key==='state')return 'running';if(key==='resume'||key==='close')return async()=>{};if(key==='createStereoPanner')return fallback?undefined:()=>{created++;const p=target.createStereoPanner(),disconnect=p.disconnect.bind(p);let done=false;p.disconnect=(...args)=>{if(!done){disconnected++;done=true;}return disconnect(...args);};return p;};const value=Reflect.get(target,key,target);return typeof value==='function'?value.bind(target):value;}});
 const audio=new GameAudio({contextFactory:()=>adapter});audio.setActive(true);await audio.unlock();for(const name of ['wind','surf','birds','insects'])audio[name].gain.setValueAtTime(0,0);
 const events=[{name:'left',enemy:{x:-3,z:0}},{name:'right',enemy:{x:3,z:0}},{name:'turn',enemy:{x:-3,z:0},yaw:Math.PI},{name:'near',enemy:{x:3,z:0}},{name:'far',enemy:{x:14,z:0}},{name:'paused',enemy:{x:3,z:0}},{name:'menu',kind:'food',menu:true},{name:'muted',enemy:{x:3,z:0}},{name:'fallback',enemy:{x:3,z:0}},{name:'center',enemy:{x:0,z:3}}];
 const waits=events.map((e,i)=>ctx.suspend(.5+i).then(async()=>{if(e.name==='paused')audio.setActive(false);if(e.name==='muted')audio.setEnabled(false);if(e.name==='fallback'){audio.setEnabled(true);audio.setActive(true);fallback=true;}if(e.name==='center')fallback=false;audio.noisePhase=.2;const options=e.kind?{menu:e.menu}:{enemyType:'boar',...enemySoundCue({x:0,z:0},e.enemy,e.yaw??0)};Object.assign(e,{actualTime:ctx.currentTime,before:audio.sources.size,createdBefore:created});audio.effect(e.kind??'enemy-windup',options);Object.assign(e,{options,after:audio.sources.size,createdAfter:created});await ctx.resume();}));
 const rendered=await ctx.startRendering();await Promise.all(waits);const channels=[rendered.getChannelData(0),rendered.getChannelData(1)];for(let i=0;i<events.length;i++){const start=Math.round((.5+i)*rate),end=Math.round((.9+i)*rate);events[i].channels=channels.map(s=>stats(s.subarray(start,end)));}
 const remaining=audio.sources.size;await audio.dispose();const blob=wav(channels,rate);if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);const media=document.createElement('audio');media.controls=true;media.src=url;const link=document.createElement('a');link.id='save';link.textContent='保存双声道WAV';link.href=url;link.download='tidelands-spatial-audio.wav';link.dataset.wav=await new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(blob);});document.querySelector('#media').replaceChildren(media,link);
 out.textContent=JSON.stringify({complete:true,sampleRate:rate,seconds:11,channels:2,bytes:blob.size,events,summary:channels.map(stats),created,disconnected,remaining,disposed:audio.context===null&&audio.sources.size===0,scope:'Native OfflineAudioContext/nodes, isolated cue fixture, same noise slice. WAV copied from DOM artifact, no ordinary save/campaign/audio audition/VRAM/device proof.'},null,2);
 }catch(error){out.textContent=JSON.stringify({complete:false,error:error.stack});console.error(error);}finally{button.disabled=false;}};
window.addEventListener('pagehide',()=>{if(url)URL.revokeObjectURL(url);});
</script></html>

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>当前181输入四岛与动作整体审查</title>
<style>html,body{margin:0;height:100%;background:#192723;color:#eee;font:13px system-ui}body{display:flex;flex-direction:column}nav{padding:8px;display:flex;gap:8px;flex-wrap:wrap}button,select{font:inherit;padding:6px}output{height:92px;overflow:auto;overflow-wrap:anywhere}canvas{flex:1;min-height:0;width:100%}</style>
<nav>生产世界/生产跟随镜头 · 声明位置及三建筑fixture · 无存档 <select id="scene"><option value="coast">海岸</option><option value="forest">林地</option><option value="highland">高地</option><option value="approach">高地南坡</option><option value="saddle">高地山脊</option><option value="shoal">浅滩</option><option value="camp">营地</option></select><select id="light"><option value="240">正午</option><option value="360">黄昏</option><option value="0">午夜</option></select><select id="pitch"><option value=".29">常规俯仰</option><option value=".08">低俯仰</option></select><button id="run" disabled>生产移动与转向180帧</button></nav>
<output>准备…</output><canvas aria-label="整场构图和全身运动诊断，不是主线验收"></canvas>
<script type="module">
import {WorldView} from '../src/scene.js';
import {loadAuthoredCast} from '../src/authored-assets.js';
import {loadWoodlandDressing} from '../src/woodland.js';
import {prepareCoastalVisual,bindCoastalVisual} from '../src/coastal.js';
import {createWorld,terrain,weatherAt} from '../src/world.js';
import {freshGame,movePlayer,tick,nearest} from '../src/game.js';
const world=createWorld(),canvas=document.querySelector('canvas'),view=new WorldView(canvas,world),out=document.querySelector('output');
view.installAuthoredCast(await loadAuthoredCast());view.installWoodlandDressing(await loadWoodlandDressing(world.objects));view.coastal=bindCoastalVisual(view,await prepareCoastalVisual());
const places={coast:[-90,140],forest:[132,-26],highland:[-75,-205],approach:[-75,-175],saddle:[-75,-232],shoal:[190,248],camp:[-56,49]};
let state,frames=0,running=false,moving=false,hidden=false,previous=null,intervals=[],distance=0,start,poses=[],bodyMotionMax={bank:0,drive:0};
function draw(){
  view.draw(state,nearest(state,world.objects),null,moving,1/60);
  if(running){bodyMotionMax.bank=Math.max(bodyMotionMax.bank,Math.abs(view.player.rotation.z));bodyMotionMax.drive=Math.max(bodyMotionMax.drive,Math.abs(view.player.userData.bodyMotion?.drive??0));}
  const sorted=[...intervals].sort((a,b)=>a-b),p=state.player,info=view.renderer.info;
  out.textContent=JSON.stringify({ready:true,runtimeInputs:181,authoredCast:!!view.authoredCast,coastalResourceIds:view.coastal.trees.length,woodlandInstalled:!!view.woodlandDressing,scene:document.querySelector('#scene').value,startTime:Number(document.querySelector('#light').value),pitch:Number(document.querySelector('#pitch').value),time:state.time,weather:weatherAt(state.time),frames,running,hidden,start,position:[p.x,p.z],height:terrain(p.x,p.z),distance,hp:p.hp,camera:view.camera.position.toArray(),poses,bodyMotionMax,raf:sorted.length?{samples:sorted.length,p95:sorted[Math.floor(sorted.length*.95)],max:sorted.at(-1)}:null,render:{calls:info.render.calls,triangles:info.render.triangles,textures:info.memory.textures},viewport:[innerWidth,innerHeight],buffer:[canvas.width,canvas.height],glError:view.renderer.getContext().getError(),scope:'Current181 runtime; declared locations/q6/axe/camp fixture, actual authored cast, coastal and woodland. Production movePlayer/tick/draw/follow camera. Pose fields are root transforms only; no detailed skeleton metric. No saves/audio/campaign/GPU/physical-device proof. Fixed1/60 simulation; rAF scheduling only.'});
}
function reset(){
  const [x,z]=places[document.querySelector('#scene').value];state=freshGame();Object.assign(state.player,{x,z});state.time=Number(document.querySelector('#light').value);state.quest=6;state.inventory.axe=1;state.selected='axe';
  if(document.querySelector('#scene').value==='camp')state.buildings=[{id:'art-fire',type:'campfire',x:-56,z:56},{id:'art-tent',type:'tent',x:-65,z:49},{id:'art-bench',type:'workbench',x:-47,z:49}];
  start=[x,z];frames=0;moving=false;hidden=false;previous=null;intervals=[];distance=0;poses=[];bodyMotionMax={bank:0,drive:0};view.yaw=.15;view.pitch=Number(document.querySelector('#pitch').value);view.player.userData.lastPosition=null;view.player.userData.worldFeet=null;view.camera.position.set(x+5,Math.max(terrain(x,z),0)+12,z+20);view.sync(state);for(let i=0;i<60;i++)draw();
}
document.querySelector('#run').onclick=()=>{
  running=true;document.querySelectorAll('button,select').forEach(e=>e.disabled=true);
  function frame(now){
    if(previous!==null)intervals.push(now-previous);previous=now;hidden||=document.hidden;
    const p=state.player,before=[p.x,p.z],angle=frames<90?0:Math.PI/2;
    movePlayer(state,world.objects,Math.sin(angle),Math.cos(angle),1/60,false);const moved=Math.hypot(p.x-before[0],p.z-before[1]);moving=moved>.001;distance+=moved;tick(state,1/60,false,null,world.objects);view.sync(state);frames++;draw();
    if(frames%30===0)poses.push({frame:frames,player:[p.x,p.z,p.yaw],body:view.player.rotation.toArray(),islanders:view.islanders.map(o=>o.model.rotation.toArray()),camera:view.camera.position.toArray(),hp:p.hp});
    if(frames<180)requestAnimationFrame(frame);else{running=false;moving=false;draw();document.querySelectorAll('button,select').forEach(e=>e.disabled=false);}
  }requestAnimationFrame(frame);
};
for(const s of document.querySelectorAll('select'))s.onchange=reset;
Promise.all([view.groundSurface.userData.ground.loaded,view.groundSurface.userData.ground.sand.loaded,view.rockSurface.userData.rock.loaded]).then(()=>{reset();document.querySelector('#run').disabled=false;}).catch(error=>{out.textContent='加载失败：'+error.message;console.error(error);});
window.addEventListener('resize',()=>{view.resize();if(state&&!running)draw();});
window.addEventListener('pagehide',()=>{view.coastal?.release();view.authoredCast?.release();view.woodlandDressing?.release();view.contactShade.dispose();view.renderer.dispose();});
</script></html>

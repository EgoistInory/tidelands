<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>全场接触层次审查</title><style>html,body{margin:0;height:100%;background:#192723;color:#eee;font:12px system-ui}body{display:flex;flex-direction:column}nav{padding:5px}output{height:85px;overflow:auto;overflow-wrap:anywhere}canvas{flex:1;min-height:0;width:100%}</style><nav>声明主体/营地/资源fixture · 无存档读写 <select id="site"><option value="coast">海岸NPC</option><option value="forest">林地NPC</option><option value="mineral">矿物</option><option value="camp">营地</option></select><select id="time"><option value="240">正午</option><option value="0">午夜</option></select><label><input id="shade" type="checkbox" checked>接触层次</label><button id="deplete">切换矿物耗尽fixture</button><button id="run">运行120帧</button></nav><output>准备…</output><canvas aria-label="生产资源人物生物与营地接触层次"></canvas><script type="module">
import {WorldView} from '../src/scene.js';import {createWorld,terrain} from '../src/world.js';import {freshGame,movePlayer,tick} from '../src/game.js';
const world=createWorld(),mineral=world.objects.find(o=>o.type==='stone'&&o.y>4&&o.scale>1),view=new WorldView(document.querySelector('canvas'),world),places={coast:[-59,94],forest:[132,-26],mineral:[mineral.x,mineral.z],camp:[-56,49]},out=document.querySelector('output');let state,frames=0,ready=false;
function draw(){const [x,z]=places[document.querySelector('#site').value],h=terrain(x,z);if(view.contactShade)view.contactShade.group.visible=document.querySelector('#shade').checked;view.draw(state,null,null,frames>0,1/60);view.camera.position.set(x+8,h+6,z+12);view.camera.lookAt(x,h+1,z+3);view.sky.position.copy(view.camera.position);view.renderer.render(view.scene,view.camera);const shade=view.contactShade;out.textContent=JSON.stringify({site:document.querySelector('#site').value,time:state.time,frames,shadeEnabled:shade?.group.visible??false,actorPatches:shade?.actorMesh.userData.patches??0,actorVertices:shade?.actorMesh.geometry.drawRange.count??0,resourceVertices:shade?.resourceMesh.geometry.attributes.position.count??0,campVertices:shade?.buildingMesh.geometry.attributes.position.count??0,resource:mineral.id,depleted:Boolean(state.depleted[mineral.id]>state.time),player:[state.player.x,state.player.z,state.player.hp],viewport:[innerWidth,innerHeight],glError:view.renderer.getContext().getError(),scope:'Declared positions/quest6/enemy/camp/depletion fixture. Production WorldView/tick/movement; no ordinary campaign,performance,physical AO or complete contact acceptance.'});}
function reset(){const [x,z]=places[document.querySelector('#site').value];state=freshGame();state.quest=6;state.time=Number(document.querySelector('#time').value);Object.assign(state.player,{x:x+2,z:z+6});state.enemies=[{id:'contact-boar',type:'boar',x:x-4,z:z+4,hp:70,attackAt:-100},{id:'contact-crab',type:'crab',x:x+4,z:z+1,hp:40,attackAt:-100}];if(document.querySelector('#site').value==='camp')state.buildings=[{id:'contact-fire',type:'campfire',x:x-4,z:z+8},{id:'contact-tent',type:'tent',x:x-7,z:z+2},{id:'contact-bench',type:'workbench',x:x+5,z:z+6}];frames=0;view.sync(state);for(let i=0;i<30;i++)draw();}
Promise.all([view.groundSurface.userData.ground.loaded,view.groundSurface.userData.ground.sand.loaded,view.rockSurface.userData.rock.loaded]).then(()=>{ready=true;reset();});for(const s of document.querySelectorAll('select'))s.onchange=reset;document.querySelector('#shade').onchange=draw;document.querySelector('#deplete').onclick=()=>{if(!ready)return;if(state.depleted[mineral.id]>state.time)delete state.depleted[mineral.id];else state.depleted[mineral.id]=state.time+10;view.sync(state);draw();};document.querySelector('#run').onclick=()=>{document.querySelectorAll('button,select,input').forEach(e=>e.disabled=true);function step(){movePlayer(state,world.objects,0,-1,1/60,false);tick(state,1/60,false,null,world.objects);frames++;view.sync(state);draw();if(frames<120)requestAnimationFrame(step);else document.querySelectorAll('button,select,input').forEach(e=>e.disabled=false);}requestAnimationFrame(step);};window.addEventListener('resize',()=>{view.resize();if(state)draw();});window.addEventListener('pagehide',()=>{view.contactShade?.dispose();view.renderer.dispose();});
</script></html>

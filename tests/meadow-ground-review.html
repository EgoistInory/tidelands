<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>实际三角地表与草根支撑隔离诊断</title><style>html,body{margin:0;height:100%;background:#192723;color:#eee;font:13px system-ui}body{display:flex;flex-direction:column}nav{padding:7px;display:flex;gap:8px}button,select{font:inherit;padding:6px}output{height:80px;overflow:auto;overflow-wrap:anywhere}canvas{flex:1;min-height:0;width:100%}</style>
<nav>生产地表/草几何 · 近距固定相机 · 隐藏人物/fallback背景 · 无存档 <select id="site"><option value="ridge">高地东脊</option><option value="slope">高地西陡坡</option><option value="coast">海岸起步区</option></select><select id="variant"><option value="old">原草根</option><option value="candidate">可见三角支撑候选</option></select></nav><output>准备实际地表…</output><canvas aria-label="只验草根与可见三角面，不是整场美术验收"></canvas>
<script type="module">
import {WorldView} from '../src/scene.js';import {createWorld,terrain} from '../src/world.js';import {freshGame,serialize} from '../src/game.js';import {buildGroundRootVariants,applyGroundRootVariants} from './visible-ground-sampler.js';
const world=createWorld(),frozen=JSON.stringify(world.objects),view=new WorldView(document.querySelector('canvas'),world),state=freshGame(),out=document.querySelector('output');

const ground=view.scene.children.find(m=>m.geometry?.attributes.groundLayers),variants=buildGroundRootVariants(view.meadow.filter(b=>b.name!=='shore-stones'),ground.geometry),places={ridge:[-41.45341110229492,-208.3750762939453],slope:[-111.45165252685547,-250.73692321777344],coast:[-64,110]};

}

</script></html>

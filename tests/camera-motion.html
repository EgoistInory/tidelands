<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>镜头连续侧移有限验收</title>
<style>html,body{margin:0;height:100%;background:#192723;color:#efe6cf;font:13px system-ui}body{display:flex;flex-direction:column}nav{padding:8px}button{padding:8px}pre{height:110px;overflow:auto;white-space:pre-wrap;font:11px monospace}canvas{width:100%;flex:1;min-height:0}</style>
<nav>镜头连续侧移 · 三路线固定步进/无存档读写/不是正常旅程或性能验收 <button id="run">运行三路线镜头采样</button></nav><pre id="result">准备世界…</pre><canvas aria-label="固定输入驱动的生产镜头场景"></canvas>
<script type="module">
import {WorldView} from '../src/scene.js';
import {createWorld,terrain} from '../src/world.js';
import {freshGame,movePlayer,tick,nearest} from '../src/game.js';
const world=createWorld(),view=new WorldView(document.querySelector('canvas'),world),button=document.querySelector('button'),output=document.querySelector('pre');
const routes=[{name:'lighthouse',x:-98.4,z:-54.3,yaw:.858},{name:'understory',x:107,z:-10,yaw:.15},{name:'shore',x:-90,z:140,yaw:Math.PI}];
let state=freshGame();state.enemies=[];view.sync(state);view.draw(state,null,null,false,1/60);output.textContent='就绪。每路线360帧，每帧固定1/60秒移动与.015弧度镜头输入；首帧重定位排除。不是实际游玩/声音或GPU证明。';
button.onclick=()=>{
  button.disabled=true;const rows=[];let routeIndex=-1,frame=0,previous=null,row=null,wallStart=performance.now();
  function step(){
    if(routeIndex<0||frame>=360){
      if(row)rows.push(row);routeIndex++;frame=0;previous=null;
      if(routeIndex>=routes.length){output.textContent=JSON.stringify({complete:true,wallMs:performance.now()-wallStart,viewport:[innerWidth,innerHeight],rows,note:'Fixed dt world-input fixture; resets between routes, first frame excluded. No save/audio/GPU or normal-play acceptance.'});return;}
      const route=routes[routeIndex];state=freshGame();state.enemies=[];Object.assign(state.player,{x:route.x,z:route.z});state.time=240;view.sync(state);view.yaw=route.yaw;view.distance=14;view.pitch=.29;
      view.camera.position.set(route.x+Math.sin(route.yaw)*14,terrain(route.x,route.z)+2.4+Math.tan(.29)*14,route.z+Math.cos(route.yaw)*14);
      row={route:route.name,frames:0,start:[route.x,route.z],maxBearingChangeDegrees:0,maxCameraTravel:0,minFocusDistance:Infinity,samples:[]};
    }
    const dt=1/60,t=frame*dt;view.yaw+=.015;movePlayer(state,world.objects,Math.sin(t*.7+.2),Math.cos(t*.7+.2),dt,false);tick(state,dt,false);view.draw(state,nearest(state,world.objects),null,true,dt);
    const p=state.player,c=view.camera.position,offset={x:c.x-p.x,y:c.y-Math.max(terrain(p.x,p.z),-.45)-2.4,z:c.z-p.z},bearing=Math.atan2(offset.x,offset.z),distance=Math.hypot(offset.x,offset.y,offset.z);
    let bearingChange=0,travel=0;if(previous){bearingChange=Math.abs(Math.atan2(Math.sin(bearing-previous.bearing),Math.cos(bearing-previous.bearing)))*180/Math.PI;travel=Math.hypot(c.x-previous.x,c.y-previous.y,c.z-previous.z);row.maxBearingChangeDegrees=Math.max(row.maxBearingChangeDegrees,bearingChange);row.maxCameraTravel=Math.max(row.maxCameraTravel,travel);row.minFocusDistance=Math.min(row.minFocusDistance,distance);}
    if(frame%12===0||bearingChange>12)row.samples.push({frame,player:[p.x,p.z],camera:c.toArray(),bearingChangeDegrees:bearingChange,focusDistance:distance,requestedOrResolvedYaw:view.yaw});
    previous={x:c.x,y:c.y,z:c.z,bearing};frame++;row.frames=frame;row.end=[p.x,p.z];if(frame%60===0)output.textContent=JSON.stringify({complete:false,current:row.route,frame,rows});requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
};
window.addEventListener('resize',()=>view.resize());window.addEventListener('pagehide',()=>view.renderer.dispose());
</script></html>

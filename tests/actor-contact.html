<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>近身接触与动作隔离验收</title>
<style>html,body{margin:0;height:100%;background:#192723;color:#efe6cf;font:13px system-ui}body{display:flex;flex-direction:column}nav{padding:6px;display:flex;gap:8px;flex-wrap:wrap}select,button{font:inherit;padding:5px}output{height:95px;overflow:auto;font:10px monospace;overflow-wrap:anywhere}canvas{flex:1;min-height:0;width:100%}</style>
<nav>明确位置/敌人/石斧fixture；生产地形与资源，无存档
<label>场景<select id="scenario"><option value="npc">走向岛民</option><option value="boar">野猪追击</option><option value="crab">海岸蟹追击</option><option value="crowd">生物初始重叠</option></select></label><button id="run" disabled>运行240帧接触</button><button id="strike" disabled>定格挥斧命中</button></nav><output>准备生产场景…</output><canvas aria-label="近身接触实际渲染"></canvas>
<script type="module">
import * as THREE from '../vendor/three.module.min.js';import {WorldView} from '../src/scene.js';import {createWorld,terrain,LANDMARKS} from '../src/world.js';import {freshGame,movePlayer,tick,attack,resolveAttack} from '../src/game.js';import {actorRadius} from '../src/actor-contact.js';import {ATTACK_IMPACT} from '../src/action-timing.js';
const world=createWorld(),view=new WorldView(document.querySelector('canvas'),world),out=document.querySelector('output'),button=document.querySelector('#run'),strike=document.querySelector('#strike');let state,frames=0,result=null,minDistance=Infinity,maxEnemyStep=0;
function reset(){state=freshGame();state.enemies=[];state.time=240;state.quest=6;state.inventory.axe=1;state.selected='axe';state.buildings=[];frames=0;result=null;minDistance=Infinity;maxEnemyStep=0;const scenario=document.querySelector('#scenario').value,npc=LANDMARKS.find(o=>o.id==='keeper');Object.assign(state.player,{x:scenario==='npc'?npc.x:-70,z:scenario==='npc'?npc.z-4:102,yaw:0});
 if(scenario!=='npc'){state.enemies=[{id:'contact-review-a',type:scenario==='crab'?'crab':'boar',x:-70,z:110,hp:70,attackAt:240}];if(scenario==='crowd')state.enemies.push({...state.enemies[0],id:'contact-review-b',x:-69});}
 view.sync(state);view.player.userData.lastPosition=null;draw();}
function draw(){view.draw(state,null,null,frames>0,1/60);const p=state.player,h=terrain(p.x,p.z);view.camera.position.set(p.x+7,h+5,p.z-7);view.camera.lookAt(p.x,h+1.2,p.z+2);view.sky.position.copy(view.camera.position);view.renderer.render(view.scene,view.camera);
 const enemies=state.enemies.map(e=>({id:e.id,type:e.type,x:e.x,z:e.z,hp:e.hp,distance:Math.hypot(e.x-p.x,e.z-p.z),contactDistance:actorRadius(e)+actorRadius(p)})),npc=LANDMARKS.find(o=>o.id==='keeper');out.textContent=JSON.stringify({scenario:document.querySelector('#scenario').value,frames,player:[p.x,p.z],hp:p.hp,enemies,npcDistance:Math.hypot(p.x-npc.x,p.z-npc.z),minDistance:Number.isFinite(minDistance)?minDistance:null,maxEnemyStep,result,viewport:[innerWidth,innerHeight],glError:view.renderer.getContext().getError(),scope:'Explicit enemy/weapon/position fixture, fixed-dt production movement and combat; no save/native input/performance/GPU/full-quality proof.'});}
button.onclick=()=>{reset();button.disabled=strike.disabled=true;function step(){const before=state.enemies.map(e=>[e.x,e.z]);if(document.querySelector('#scenario').value==='npc')movePlayer(state,world.objects,0,1,1/60);tick(state,1/60,false,null,world.objects);state.enemies.forEach((e,i)=>{maxEnemyStep=Math.max(maxEnemyStep,Math.hypot(e.x-before[i][0],e.z-before[i][1]));minDistance=Math.min(minDistance,Math.hypot(e.x-state.player.x,e.z-state.player.z));});frames++;view.sync(state);draw();if(frames<240)requestAnimationFrame(step);else button.disabled=strike.disabled=false;}requestAnimationFrame(step);};
strike.onclick=()=>{const a=attack(state,{defer:true});if(a.pending){state.time=a.pending.at+ATTACK_IMPACT;result=resolveAttack(state,a.pending);view.sync(state);draw();}};
document.querySelector('#scenario').onchange=reset;Promise.all([view.groundSurface.userData.ground.loaded,view.groundSurface.userData.ground.sand.loaded,view.rockSurface.userData.rock.loaded]).then(()=>{reset();button.disabled=strike.disabled=false;});window.addEventListener('resize',()=>{view.resize();if(state)draw();});window.addEventListener('pagehide',()=>view.renderer.dispose());
</script></html>

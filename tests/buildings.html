<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>建筑模型隔离验收</title><style>body{margin:0;background:#203239;color:#fff;font:16px system-ui}nav{position:absolute;padding:16px}button{padding:10px;margin:4px}canvas{display:block;width:100vw;height:100vh}</style><nav>生产建筑模型 · 结构审查（帐篷 / 工作台）</nav><output id="probe" style="position:fixed;bottom:0;background:#fff;color:#111;font:12px monospace"></output><canvas></canvas><script type="module">
import * as THREE from '../vendor/three.module.min.js';
import {buildingModel} from '../src/scene.js';
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,100),renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setClearColor(0x203239);camera.position.set(8,6,12);camera.lookAt(0,.8,0);scene.add(new THREE.HemisphereLight(0xffffff,0x6e6c52,2));const sun=new THREE.DirectionalLight(0xffe5c2,3);sun.position.set(-4,8,5);scene.add(sun);
const models=['tent','workbench'].map((type,i)=>{const root=buildingModel(type);root.position.x=i?3:-3;scene.add(root);return root;});
let frames=0,start=performance.now();const gaps=[];let walk=false,time=10,last=start;
setInterval(()=>{const sorted=[...gaps].sort((a,b)=>a-b);document.getElementById("probe").textContent=JSON.stringify({frames,elapsedMs:Math.round(performance.now()-start),frameAgeMs:Math.round(performance.now()-last),medianMs:Math.round(sorted[Math.floor(sorted.length*.5)]||0),visibility:document.visibilityState});},1000);function frame(now){if(frames)gaps.push(now-last);frames++;const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;renderer.render(scene,camera);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>

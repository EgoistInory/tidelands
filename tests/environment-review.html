<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>群岛环境整体审查</title>
<style>html,body{margin:0;height:100%;background:#192723;color:#efe6cf;font:13px system-ui}body{display:flex;flex-direction:column}nav{padding:6px;display:flex;gap:10px;flex-wrap:wrap}select,button{padding:5px;font:inherit}output{height:64px;overflow:auto;font:10px monospace;overflow-wrap:anywhere}canvas{flex:1;min-height:0;width:100%}</style>
<nav>明确位置/无敌人/任务6/营地fixture；不读写存档
<label>区域<select id="region"><option value="coast">海岸丘陵</option><option value="forest">林地</option><option value="highland">高地</option><option value="shoal">浅滩</option><option value="shore">海岸水线</option><option value="amber">浅滩水线</option><option value="camp">普通营地</option></select></label>
<label>时间<select id="time"><option value="240">正午</option><option value="0">午夜</option></select></label><button disabled>连续探索180帧</button></nav>
<output>准备实际材质…</output><canvas aria-label="群岛环境实际渲染"></canvas>
<script type="module">
import {WorldView} from '../src/scene.js';import {createWorld,terrain} from '../src/world.js';import {freshGame,tick,movePlayer,nearest} from '../src/game.js';
const world=createWorld(),view=new WorldView(document.querySelector('canvas'),world),out=document.querySelector('output'),button=document.querySelector('button');
const places={coast:[-90,20,1.5,.29],forest:[132,-45,.15,.29],highland:[-75,-235,1.7,.29],shoal:[145,180,2.5,.29],shore:[-187,80,.85,.24],amber:[192,205,2.9,.24],camp:[-83.8,100.03,.15,.29]};let state,frames=0,ready=false;
function draw(moving=false){view.draw(state,nearest(state,world.objects),null,moving,1/60);out.textContent=JSON.stringify({ready,region:document.querySelector('#region').value,clock:state.time,frames,viewport:[innerWidth,innerHeight],player:[state.player.x,state.player.z],ground:view.groundSurface.userData.ground.state.status,sand:view.groundSurface.userData.ground.sand.state.status,rock:view.rockSurface.userData.rock.state.status,glError:view.renderer.getContext().getError(),drawCalls:view.renderer.info.render.calls,triangles:view.renderer.info.render.triangles,textures:view.renderer.info.memory.textures,scope:'Declared position/quest6/no-enemies/camp fixture; fixed-dt motion, no save/input/GPU/full-quality acceptance.'});}
function reset(){const p=places[document.querySelector('#region').value];frames=0;state=freshGame();state.enemies=[];state.quest=6;state.time=Number(document.querySelector('#time').value);Object.assign(state.player,{x:p[0],z:p[1]});state.buildings=document.querySelector('#region').value==='camp'?[{id:'environment-fire',type:'campfire',x:-78.71355,z:103.33234}]:[];view.sync(state);view.yaw=p[2];view.pitch=p[3];view.distance=14;view.camera.position.set(p[0]+Math.sin(p[2])*14,terrain(p[0],p[1])+2.4+Math.tan(p[3])*14,p[1]+Math.cos(p[2])*14);draw();}
document.querySelectorAll('select').forEach(e=>e.onchange=reset);button.onclick=()=>{button.disabled=true;frames=0;function step(){movePlayer(state,world.objects,Math.cos(view.yaw),-Math.sin(view.yaw),1/60,false);tick(state,1/60,false);frames++;draw(true);if(frames<180)requestAnimationFrame(step);else button.disabled=false;}requestAnimationFrame(step);};
Promise.all([view.groundSurface.userData.ground.loaded,view.groundSurface.userData.ground.sand.loaded,view.rockSurface.userData.rock.loaded]).then(()=>{ready=true;button.disabled=false;reset();});window.addEventListener('resize',()=>{view.resize();if(state)draw();});window.addEventListener('pagehide',()=>view.renderer.dispose());
</script></html>

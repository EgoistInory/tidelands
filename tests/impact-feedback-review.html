<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>真实主循环采集与交战反馈</title>
<style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{overflow:hidden}#result{position:fixed;left:0;top:0;max-width:420px;max-height:115px;overflow:auto;background:#fff;color:#111;font:10px monospace;z-index:100;pointer-events:none}</style>
<output id="result">准备标注fixture…</output><iframe title="生产游戏反馈隔离验收"></iframe><script type="module">
const mode=new URL(location.href).searchParams.get('mode')??'stone';if(!['stone','fiber','combat','miss'].includes(mode))throw Error('Unknown feedback fixture');
const response=await fetch('../index.html',{cache:'no-store'});if(!response.ok)throw Error('index HTTP '+response.status);
const doc=new DOMParser().parseFromString(await response.text(),'text/html'),base=doc.createElement('base');base.href=new URL('../',location.href).href;doc.head.prepend(base);doc.body.dataset.testHarness='true';for(const script of doc.querySelectorAll('script'))script.remove();
// Keep the actual pause UI visible, off the central actor in desktop inspection shots.
const style=doc.createElement('style');style.textContent='#panel{margin-right:12px;max-width:300px}#panel::backdrop{backdrop-filter:none!important;background:transparent!important}';doc.head.append(style);
const setup=doc.createElement('script');setup.type='module';setup.textContent=`
import {boot} from './src/main.js';import {freshGame,nearest} from './src/game.js';import {createWorld,terrain} from './src/world.js';import {resourceHalfSize} from './src/resource-contact.js';import {WorldView} from './src/scene.js';import {GameAudio} from './src/audio.js';
const sourceFiles=['src/main.js','src/scene.js','src/impact-feedback.js','src/authored-character.js'],sources=Object.fromEntries(await Promise.all(sourceFiles.map(async path=>{const b=await(await fetch('./'+path,{cache:'no-store'})).arrayBuffer(),digest=await crypto.subtle.digest('SHA-256',b);return [path,Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('')];})));
const mode=${JSON.stringify(mode)},state=freshGame(),world=createWorld(),events=[],sounds=[];let viewRef=null,audioRef=null,autoPaused=false,frames=0;
state.quest=6;state.time=240;state.inventory.axe=state.inventory.sword=1;state.selected=mode==='combat'||mode==='miss'?'sword':'axe';state.enemies.forEach(e=>e.hp=0);
let target=null;
if(['stone','fiber'].includes(mode)){
 const candidates=world.objects.filter(o=>o.type===mode&&terrain(o.x,o.z)>2).sort((a,b)=>Math.hypot(a.x-136,a.z+22)-Math.hypot(b.x-136,b.z+22));
 for(const object of candidates){const x=object.x,z=object.z+resourceHalfSize(object)+1;if(terrain(x,z)<.2)continue;Object.assign(state.player,{x,z,yaw:Math.PI});if(nearest(state,world.objects)?.id===object.id){target=object;break;}}
 if(!target)throw Error('No reachable real resource for fixture');
}else{target=state.enemies.find(e=>e.type==='crab');Object.assign(target,{hp:mode==='miss'?0:40,x:state.player.x+2.6,z:state.player.z,attackAt:state.time});state.player.yaw=Math.PI/2;}
const effect=GameAudio.prototype.effect;GameAudio.prototype.effect=function(kind,options){audioRef=this;const before=this.sources.size;effect.call(this,kind,options);if(['gather','swing','hit'].includes(kind))sounds.push({kind,time:state.time,before,after:this.sources.size,context:this.context?.state});};
function report(){parent.document.querySelector('#result').textContent=JSON.stringify({fixture:mode,sources,target:{id:target.id,type:target.type,x:target.x,z:target.z},events,sounds,frames,paused:document.querySelector('#panel').open,time:state.time,hp:state.player.hp,inventory:state.inventory,kills:state.kills,targetHp:target.hp??null,poolActive:viewRef?.impacts.active??0,plan:viewRef?.player.userData.plan??null,authored:viewRef?.player.userData.authored??false,render:viewRef?{calls:viewRef.renderer.info.render.calls,triangles:viewRef.renderer.info.render.triangles,geometries:viewRef.renderer.info.memory.geometries,textures:viewRef.renderer.info.memory.textures}:null,glError:viewRef?.renderer.getContext().getError()??null,viewport:[innerWidth,innerHeight],scope:'Production boot/input/resolve/draw/audio. Declared sword+axe/quest6, forest resource or nearby crab fixture; own save key. Auto-pause through actual pause UI after first confirmed cue; QA panel shifted right and pause backdrop unblurred for inspection. Not ordinary campaign, blade mesh contact, audition/device/final quality.'});}
const draw=WorldView.prototype.draw;WorldView.prototype.draw=function(s,...args){
 if(!viewRef){viewRef=this;const spawn=this.impacts.spawn;this.impacts.spawn=cue=>{events.push({cue:{...cue},time:state.time,hp:state.player.hp,targetHp:target.hp??null,inventory:{...state.inventory},kills:state.kills});return spawn(cue);};}
 draw.call(this,s,...args);frames++;
 if(events.length&&!autoPaused&&state.time-events[0].time>=.08){autoPaused=true;queueMicrotask(()=>document.querySelector('#pause-button').click());}
 report();};
boot({initialState:state,storageKey:'tidelands-qa-impact-feedback-'+mode});
`;doc.body.append(setup);document.querySelector('iframe').srcdoc='<!doctype html>'+doc.documentElement.outerHTML;
</script></html>

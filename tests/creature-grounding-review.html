<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>生物坡面接地整体审查</title><style>html,body{margin:0;height:100%;background:#182922;color:#eee;font:12px system-ui}body{display:flex;flex-direction:column}nav{padding:6px}output{height:75px;overflow:auto;overflow-wrap:anywhere}canvas{flex:1;min-height:0;width:100%}</style><nav>声明区域/敌人fixture · 不读写存档 <select id="region"><option value="coast">海岸</option><option value="forest">林地</option><option value="highland">高地</option><option value="shoal">浅滩</option></select><select id="type"><option value="boar">野猪</option><option value="crab">蟹</option></select><button id="run" disabled>运行180帧追击</button></nav><output>准备…</output><canvas aria-label="生产生物与实际坡面"></canvas><script type="module">
import {WorldView} from '../src/scene.js';import {createWorld,terrain} from '../src/world.js';import {freshGame,tick} from '../src/game.js';
const world=createWorld(),view=new WorldView(document.querySelector('canvas'),world),out=document.querySelector('output'),run=document.querySelector('#run'),places={coast:[-110,70],forest:[95,-127],highland:[-51.26,-196.9],shoal:[107,193]};let state,frames;
function reset(){const [x,z]=places[document.querySelector('#region').value];state=freshGame();state.quest=6;state.time=240;state.enemies=[{id:'ground-review',type:document.querySelector('#type').value,x,z,hp:70,attackAt:-100}];Object.assign(state.player,{x:x+8,z:z+2});frames=0;view.sync(state);for(let i=0;i<30;i++)draw();}
function draw(){view.draw(state,null,null,false,1/60);const e=state.enemies[0],h=terrain(e.x,e.z),model=view.creatures.get(e.id);view.camera.position.set(e.x+6,h+3.5,e.z+7);view.camera.lookAt(e.x,h+.9,e.z);view.sky.position.copy(view.camera.position);view.renderer.render(view.scene,view.camera);out.textContent=JSON.stringify({region:document.querySelector('#region').value,type:e.type,frames,position:[e.x,e.z],hp:state.player.hp,groundY:h,bodyTilt:model.userData.ground.rotation.toArray(),bodyLift:model.userData.ground.position.y,viewport:[innerWidth,innerHeight],glError:view.renderer.getContext().getError(),scope:'Declared creature/position/quest6 fixture; production terrain,tick,WorldView. Not ordinary campaign,performance,full foot IK or quality acceptance.'});}
run.onclick=()=>{run.disabled=true;document.querySelectorAll('select').forEach(s=>s.disabled=true);function step(){tick(state,1/60,false,null,world.objects);frames++;view.sync(state);draw();if(frames<180)requestAnimationFrame(step);else{run.disabled=false;document.querySelectorAll('select').forEach(s=>s.disabled=false);}}requestAnimationFrame(step);};for(const s of document.querySelectorAll('select'))s.onchange=reset;Promise.all([view.groundSurface.userData.ground.loaded,view.groundSurface.userData.ground.sand.loaded,view.rockSurface.userData.rock.loaded]).then(()=>{reset();run.disabled=false;});window.addEventListener('resize',()=>{view.resize();if(state)draw();});window.addEventListener('pagehide',()=>view.renderer.dispose());
</script></html>

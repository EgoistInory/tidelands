<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>四岛树林整体实景审查</title>
<style>html,body{margin:0;height:100%;background:#192723;color:#efe6cf;font:13px system-ui}body{display:flex;flex-direction:column}nav{padding:6px;display:flex;gap:8px;flex-wrap:wrap}select,button{padding:6px;font:inherit}output{height:92px;overflow:auto;overflow-wrap:anywhere;font:10px monospace;padding:4px}canvas{flex:1;min-height:0;width:100%;display:block}</style>
<nav>声明区域/任务6/无敌人fixture · 不读写存档
<label>区域<select id="region"><option value="coast">潮汐海岸</option><option value="forest">苍翠林地</option><option value="highland">雾岬高地</option><option value="shoal">琥珀浅滩</option></select></label>
<label>时段<select id="time"><option value="240">正午</option><option value="340">黄昏</option><option value="0">午夜</option></select></label><button id="run" disabled>沿树林移动180帧</button></nav>
<output>准备世界…</output><canvas aria-label="实际生产四岛树林画面"></canvas>
<script type="module">
import {WorldView} from '../src/scene.js';import {createWorld,terrain} from '../src/world.js';import {freshGame,movePlayer,tick,nearest} from '../src/game.js';
const world=createWorld(),view=new WorldView(document.querySelector('canvas'),world),out=document.querySelector('output'),button=document.querySelector('#run');
const regions={coast:{x:-126,z:69},forest:{x:96,z:-127},highland:{x:-39,z:-262},shoal:{x:107,z:193}};let state,ready=false,frames=0;
function draw(){view.draw(state,nearest(state,world.objects),null,frames>0,1/60);out.textContent=JSON.stringify({ready,region:document.querySelector('#region').value,time:state.time,frames,player:[state.player.x,state.player.z],viewport:[innerWidth,innerHeight],camera:view.camera.position.toArray(),focusDistance:view.camera.position.distanceTo(view.player.position.clone().add({x:0,y:2.4,z:0})),trees:world.objects.filter(o=>o.type==='tree').length,treeBatches:view.batches.filter(b=>b.entries[0]?.type==='tree').map(b=>({form:b.batch.userData.treeForm??'shared',count:b.entries.length,triangles:(b.batch.geometry.index?.count??b.batch.geometry.attributes.position.count)/3})),drawCalls:view.renderer.info.render.calls,triangles:view.renderer.info.render.triangles,glError:view.renderer.getContext().getError(),scope:'Declared region/no enemies/quest6; production WorldView, fixed-dt180frame movement. No ordinary save/input, full-quality or frame-performance acceptance.'});}
function reset(){const p=regions[document.querySelector('#region').value];state=freshGame();state.enemies=[];state.quest=6;Object.assign(state.player,p);state.time=Number(document.querySelector('#time').value);view.sync(state);frames=0;view.yaw=.15;view.pitch=.31;view.distance=17;view.camera.position.set(p.x+Math.sin(.15)*17,terrain(p.x,p.z)+2.4+Math.tan(.31)*17,p.z+Math.cos(.15)*17);for(let i=0;i<30;i++)view.draw(state,nearest(state,world.objects),null,false,1/60);draw();}
for(const select of document.querySelectorAll('select'))select.onchange=reset;
button.onclick=()=>{button.disabled=true;document.querySelectorAll('select').forEach(s=>s.disabled=true);function step(){movePlayer(state,world.objects,.8,-.3,1/60,false);tick(state,1/60,false);frames++;draw();if(frames<180)requestAnimationFrame(step);else{button.disabled=false;document.querySelectorAll('select').forEach(s=>s.disabled=false);}}requestAnimationFrame(step);};
Promise.all([view.groundSurface.userData.ground.loaded,view.groundSurface.userData.ground.sand.loaded,view.rockSurface.userData.rock.loaded]).then(()=>{ready=true;button.disabled=false;reset();});window.addEventListener('resize',()=>{view.resize();if(state)draw();});window.addEventListener('pagehide',()=>view.renderer.dispose());
</script></html>

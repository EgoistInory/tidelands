<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>生物造型与全画布GPU压力检视</title>
<style>html,body{margin:0;height:100%;background:#192723;color:#fff;font:12px system-ui}canvas{display:block;width:100%;height:100%}nav,output{position:absolute;left:0;background:#192723d9;padding:8px;max-width:600px;z-index:2}nav{top:0}output{top:48px;max-height:130px;overflow:auto;overflow-wrap:anywhere}button{padding:7px}</style>
<nav>完整画布 · 作者四身份 · 每帧全身挥剑+受击+48碎屑压力fixture · 无存档/音频 <button id="run" disabled>五阶段GPU采样</button><button id="release" disabled>释放生物与碎屑</button></nav><output id="result">准备…</output><canvas aria-label="48碎屑压力fixture，非普通游戏/真机验收"></canvas>
<script type="module">
import {WorldView} from '../src/scene.js';import {loadAuthoredCast} from '../src/authored-assets.js';import {createWorld,terrain} from '../src/world.js';import {freshGame,nearest,tick} from '../src/game.js';
const sources=Object.fromEntries(await Promise.all(['src/creature.js','src/creature-surface.js','src/authored-character.js','src/scene.js','assets/characters/action-landmarks.json','src/impact-feedback.js'].map(async path=>[path,Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',await(await fetch('../'+path,{cache:'no-store'})).arrayBuffer())),b=>b.toString(16).padStart(2,'0')).join('')])));
const stages=[{name:'shore',x:-90,z:140,time:240},{name:'forest',x:132,z:-26,time:240},{name:'highland',x:-75,z:-205,time:360},{name:'shoal',x:190,z:248,time:120},{name:'night-camp',x:-56,z:49,time:0}];
const world=createWorld(),canvas=document.querySelector('canvas'),out=document.querySelector('output'),button=document.querySelector('button'),view=new WorldView(canvas,world),gl=view.renderer.getContext(),ext=gl.getExtension('EXT_disjoint_timer_query_webgl2'),queries=new Set(),rows=[];
let hidden=false,disjoint=false,peak=0,lastState=null;const raf=()=>new Promise(requestAnimationFrame),summary=values=>{const a=[...values].sort((a,b)=>a-b);return {samples:a.length,p95:a[Math.floor(a.length*.95)],max:a.at(-1)};};
function draw(state){hidden||=document.hidden;tick(state,1/60,false,null,world.objects);state.attackAt=state.time-.225;view.hurtAt=state.time-.12;for(let i=0;i<8;i++)view.impacts.spawn({kind:i%2?'stone':'hit',x:state.player.x+(i%3)*.2,y:terrain(state.player.x,state.player.z)+1.3,z:state.player.z-.5,floor:terrain(state.player.x,state.player.z),time:state.time-.08});view.draw(state,nearest(state,world.objects),null,false,1/60);peak=Math.max(peak,view.impacts.active);}
function read(waiting,values){disjoint||=gl.getParameter(ext.GPU_DISJOINT_EXT);if(disjoint)throw Error('GPU disjoint');for(let i=waiting.length-1;i>=0;i--){const {q,index}=waiting[i];if(!gl.getQueryParameter(q,gl.QUERY_RESULT_AVAILABLE))continue;values[index]=gl.getQueryParameter(q,gl.QUERY_RESULT)/1e6;gl.deleteQuery(q);queries.delete(q);waiting.splice(i,1);}}
await Promise.all([loadAuthoredCast().then(c=>view.installAuthoredCast(c)),view.groundSurface.userData.ground.loaded,view.groundSurface.userData.ground.sand.loaded,view.rockSurface.userData.rock.loaded]);
button.disabled=!ext;out.textContent=ext?'就绪：每阶段40预热/60真实查询。强制全身攻击/受击与48块模拟多目标压力，不是普通伤害结果。':'GPU timer extension unavailable';
button.onclick=async()=>{view.resize();button.disabled=true;rows.length=0;hidden=disjoint=false;peak=0;try{
 for(const stage of stages){const state=freshGame();lastState=state;Object.assign(state.player,{x:stage.x,z:stage.z});state.quest=6;state.time=stage.time;state.inventory.sword=1;state.selected='sword';
  if(stage.name==='night-camp')state.buildings=[{id:'gpu-fire',type:'campfire',x:-56,z:56},{id:'gpu-tent',type:'tent',x:-65,z:49},{id:'gpu-bench',type:'workbench',x:-47,z:49}];
  view.player.userData.lastPosition=null;view.sync(state);view.yaw=.15;view.camera.position.set(stage.x+5,Math.max(terrain(stage.x,stage.z),0)+12,stage.z+20);
  for(let i=0;i<40;i++){await raf();draw(state);}const waiting=[],gpu=[],cpu=[],intervals=[];let prior=null;
  for(let i=0;i<60;i++){const now=await raf();if(prior!==null)intervals.push(now-prior);prior=now;read(waiting,gpu);const q=gl.createQuery();queries.add(q);gl.beginQuery(ext.TIME_ELAPSED_EXT,q);const started=performance.now();draw(state);cpu.push(performance.now()-started);gl.endQuery(ext.TIME_ELAPSED_EXT);waiting.push({q,index:i});}
  const started=performance.now();while(waiting.length){await raf();read(waiting,gpu);if(performance.now()-started>4000)throw Error('GPU query drain timeout');}
  if(gpu.length!==60||gpu.some(n=>!(n>0)))throw Error('Incomplete GPU samples');const info=view.renderer.info;rows.push({stage:stage.name,gpuMs:summary(gpu),gpuRawMs:gpu,cpuMs:summary(cpu),rafMs:summary(intervals),poolActive:view.impacts.active,drawCalls:info.render.calls,triangles:info.render.triangles,geometries:info.memory.geometries,textures:info.memory.textures,programs:info.programs.length,action:view.player.userData.actionSource,hurt:view.player.userData.hurtSource,plan:view.player.userData.plan});out.textContent=JSON.stringify({complete:false,rows});
 }
 out.textContent=JSON.stringify({complete:true,sources,authored:view.player.userData.authored,rows,peak,hidden,disjoint,glError:gl.getError(),viewport:[innerWidth,innerHeight],buffer:[canvas.width,canvas.height],pixelRatio:view.renderer.getPixelRatio(),devicePixelRatio:window.devicePixelRatio,scope:'Full production WorldView + authored cast, stationary attack progress .5 and hit phase .4 plus48 explicitly forced debris instances each frame; five teleported fixed stages,40 warmup/60 native GPU samples. Separate CPU/rAF. Not normal gameplay, true mobile hardware, audition, VRAM/leak freedom or final quality.'});
}catch(error){out.textContent=JSON.stringify({complete:false,rows,error:error.message});console.error(error);}finally{for(const q of queries)gl.deleteQuery(q);queries.clear();button.disabled=false;document.querySelector('#release').disabled=false;}};
document.querySelector('#release').onclick=()=>{const report=JSON.parse(out.textContent),before={geometries:view.renderer.info.memory.geometries,textures:view.renderer.info.memory.textures};view.impacts.dispose();view.scene.remove(view.impacts.mesh);for(const g of view.creatures.values()){view.disposeGroup(g);view.scene.remove(g);}view.creatures.clear();view.draw(lastState,nearest(lastState,world.objects),null,false,0);report.release={before,after:{geometries:view.renderer.info.memory.geometries,textures:view.renderer.info.memory.textures},active:view.impacts.active,creatureCount:view.creatures.size,geometryCacheSize:view.creatureGeometryCache.size};out.textContent=JSON.stringify(report);document.querySelector('#release').disabled=true;button.disabled=true;};
window.addEventListener('resize',()=>view.resize());window.addEventListener('pagehide',()=>{for(const q of queries)gl.deleteQuery(q);view.impacts.dispose();view.authoredCast?.release();view.contactShade.dispose();view.renderer.dispose();});
</script></html>

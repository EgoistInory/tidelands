<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>夜间主体与环境层次审查</title><style>html,body{margin:0;height:100%;background:#18252c;color:#eee;font:12px system-ui}body{display:flex;flex-direction:column}nav{padding:6px}output{height:70px;overflow:auto;overflow-wrap:anywhere}canvas{flex:1;min-height:0;width:100%}</style><nav>声明玩家/NPC/两类敌人/营地fixture · 不读写存档 <select id="site"><option value="coast">海岸阿岚</option><option value="forest">林地林栖</option><option value="highland">高地远舟</option><option value="camp">营地</option></select><select id="time"><option value="0">晴朗午夜</option><option value="1440">阴天午夜</option><option value="240">正午</option></select></nav><output>准备…</output><canvas aria-label="生产夜间玩家NPC与两类生物"></canvas><script type="module">
import {WorldView} from '../src/scene.js';import {createWorld,terrain} from '../src/world.js';import {freshGame} from '../src/game.js';
const view=new WorldView(document.querySelector('canvas'),createWorld()),places={coast:[-59,94],forest:[132,-26],highland:[-70,-190],camp:[-56,49]},out=document.querySelector('output');let state;
function draw(){const [x,z]=places[document.querySelector('#site').value],h=terrain(x,z);view.draw(state,null,null,false,1/60);view.camera.position.set(x+11,h+10,z+18);view.camera.lookAt(x,h+1,z+4);view.sky.position.copy(view.camera.position);view.renderer.render(view.scene,view.camera);out.textContent=JSON.stringify({site:document.querySelector('#site').value,time:state.time,viewport:[innerWidth,innerHeight],ambientSky:view.ambient.color.toArray(),ambientGround:view.ambient.groundColor.toArray(),ambientIntensity:view.ambient.intensity,nightSideIntensity:view.nightLight.intensity,sunIntensity:view.sun.intensity,player:[state.player.x,state.player.z],glError:view.renderer.getContext().getError(),scope:'Declared positions/quest6/two enemies/camp; frozen production WorldView, no save, movement,performance,normal campaign or full quality proof.'});}
function reset(){const [x,z]=places[document.querySelector('#site').value];state=freshGame();state.quest=6;state.time=Number(document.querySelector('#time').value);Object.assign(state.player,{x:x+2,z:z+8});state.enemies=[{id:'night-boar',type:'boar',x:x-4,z:z+4,hp:70,attackAt:-100},{id:'night-crab',type:'crab',x:x+5,z:z+3,hp:40,attackAt:-100}];if(document.querySelector('#site').value==='camp')state.buildings=[{id:'night-fire',type:'campfire',x:x-4,z:z+9},{id:'night-tent',type:'tent',x:x-8,z:z+2}];view.sync(state);for(let i=0;i<30;i++)draw();}
Promise.all([view.groundSurface.userData.ground.loaded,view.groundSurface.userData.ground.sand.loaded,view.rockSurface.userData.rock.loaded]).then(reset);for(const s of document.querySelectorAll('select'))s.onchange=reset;window.addEventListener('resize',()=>{view.resize();if(state)draw();});window.addEventListener('pagehide',()=>view.renderer.dispose());
</script></html>

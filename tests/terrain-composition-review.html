<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>四岛宽尺度地形构图候选</title>
<style>html,body{margin:0;height:100%;background:#192723;color:#eee;font:13px system-ui}body{display:flex;flex-direction:column}nav{display:flex;flex-wrap:wrap;gap:8px;padding:6px}select,button{font:inherit;padding:5px}select{max-width:190px}output{height:78px;overflow:auto;font:10px monospace;overflow-wrap:anywhere}canvas{flex:1;min-height:0;width:100%}</style>
<nav><select id="place" aria-label="场景"><option value="coast">海岸</option><option value="forest">林地</option><option value="highland">高地</option><option value="shoal">浅滩</option><option value="camp">营地</option></select><select id="light" aria-label="时间"><option value="240">正午</option><option value="0">午夜</option></select><button id="run" disabled>生产移动180帧</button></nav>
<output>准备四岛生产地形，隔离fixture，无存档…</output><canvas aria-label="完整生产地形图与碰撞候选"></canvas>
<script type="module">
import {WorldView} from '../src/scene.js';import {createWorld,terrain,weatherAt} from '../src/world.js';import {freshGame,movePlayer,tick,nearest} from '../src/game.js';import {loadAuthoredCast} from '../src/authored-assets.js';
const canvas=document.querySelector('canvas'),out=document.querySelector('output'),world=createWorld(),view=new WorldView(canvas,world);
const places={coast:[-90,140],forest:[132,-26],highland:[-75,-205],shoal:[190,248],camp:[-56,49]};
const sources=Object.fromEntries(await Promise.all(['src/ground-surface.js','src/scene.js','src/world.js','src/game.js'].map(async n=>{const b=await(await fetch('../'+n,{cache:'no-store'})).arrayBuffer();return[n,Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b)),b=>b.toString(16).padStart(2,'0')).join('')];})));
let state,frames=0,distance=0,running=false,hidden=false,intervals=[],last=null;
function draw(moving=false){view.draw(state,nearest(state,world.objects),null,moving,1/60);const info=view.renderer.info,sorted=[...intervals].sort((a,b)=>a-b);out.textContent=JSON.stringify({ready:true,place:document.querySelector('#place').value,sources,position:[state.player.x,state.player.z],camera:view.camera.position.toArray(),time:state.time,weather:weatherAt(state.time),viewport:[innerWidth,innerHeight],buffer:[canvas.width,canvas.height],render:{calls:info.render.calls,triangles:info.render.triangles,textures:info.memory.textures,programs:info.programs.length},glError:view.renderer.getContext().getError(),frames,distance,running,hidden,raf:sorted.length?{p95:sorted[Math.floor(sorted.length*.95)],max:sorted.at(-1)}:null,scope:'Declared production-world fixture, coherent terrain/resources/camera/movement runtime snapshot. No normal save, GPU, endurance, device or final art proof.'});}
function reset(){const [x,z]=places[document.querySelector('#place').value];state=freshGame();Object.assign(state.player,{x,z});state.quest=6;state.time=Number(document.querySelector('#light').value);if(document.querySelector('#place').value==='camp')state.buildings=[{id:'surface-fire',type:'campfire',x:-56,z:56}];frames=distance=0;last=null;intervals=[];hidden=false;view.yaw=.15;view.pitch=.29;view.camera.position.set(x+5,Math.max(terrain(x,z),0)+12,z+20);view.player.userData.lastPosition=null;view.player.userData.worldFeet=null;view.sync(state);for(let i=0;i<90;i++)draw();}
for(const e of document.querySelectorAll('select'))e.onchange=reset;
document.querySelector('#run').onclick=()=>{running=true;document.querySelectorAll('button,select').forEach(e=>e.disabled=true);function frame(now){hidden||=document.hidden;if(last!==null)intervals.push(now-last);last=now;const p=state.player,x=p.x,z=p.z;movePlayer(state,world.objects,frames<90?0:1,frames<90?1:0,1/60,false);distance+=Math.hypot(p.x-x,p.z-z);tick(state,1/60,false,null,world.objects);view.sync(state);frames++;draw(true);if(frames<180)requestAnimationFrame(frame);else{running=false;draw();document.querySelectorAll('button,select').forEach(e=>e.disabled=false);}}requestAnimationFrame(frame);};
document.querySelectorAll('button,select').forEach(e=>e.disabled=true);
await Promise.all([loadAuthoredCast().then(c=>view.installAuthoredCast(c)),view.groundSurface.userData.ground.loaded,view.groundSurface.userData.ground.sand.loaded,view.rockSurface.userData.rock.loaded]);reset();document.querySelectorAll('button,select').forEach(e=>e.disabled=false);
window.addEventListener('resize',()=>{view.resize();if(state&&!running)draw();});window.addEventListener('pagehide',()=>{view.authoredCast?.release();view.contactShade.dispose();view.renderer.dispose();});
</script></html>

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>新增林带采集保存隔离验收</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}output{position:fixed;bottom:0;left:0;right:0;z-index:100;background:#fff;color:#111;font:11px monospace;pointer-events:none}</style><iframe title="新增林带显式位置fixture，生产入口"></iframe><output>准备独立QA存档…</output><script type="module">
import {createWorld} from '../src/world.js';import {freshGame,nearest} from '../src/game.js';
const world=createWorld(),s=freshGame();s.quest=6;s.enemies.forEach(e=>e.hp=0);s.inventory.axe=1;s.selected='axe';let chosen;
for(const node of world.objects.filter(o=>/^resource-19\d\d$/.test(o.id))){for(const [dx,dz] of [[0,2],[2,0],[0,-2],[-2,0]]){Object.assign(s.player,{x:node.x+dx,z:node.z+dz});if(nearest(s,world.objects)?.id===node.id){chosen=node;break;}}if(chosen)break;}
if(!chosen)throw Error('No clear grove fixture');document.querySelector('output').textContent=JSON.stringify({fixture:true,node:chosen,storageKey:'tidelands-qa-grove-ecology-v1',note:'Explicit axe/quest6/no-enemies fixture. First load seeds a new QA key; reload restores it through the normal production loader. Never reads/writes the ordinary key.'});
const response=await fetch('../index.html');if(!response.ok)throw Error('index HTTP '+response.status);const doc=new DOMParser().parseFromString(await response.text(),'text/html'),base=doc.createElement('base');base.href=new URL('../',location.href).href;doc.head.prepend(base);for(const script of doc.querySelectorAll('script'))script.remove();
const setup=doc.createElement('script');setup.type='module';setup.textContent=`import {boot} from './src/main.js';const storageKey='tidelands-qa-grove-ecology-v1',seed=${JSON.stringify(s)};let initialState=seed;try{if(localStorage.getItem(storageKey))initialState=null;}catch{}boot({initialState,storageKey});`;doc.body.append(setup);document.querySelector('iframe').srcdoc='<!doctype html>'+doc.documentElement.outerHTML;
</script></html>

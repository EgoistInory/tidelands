<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>遗迹空间与接触验收</title><style>html,body{margin:0;height:100%;background:#192723;color:#efe6cf;font:13px system-ui}body{display:flex;flex-direction:column}nav{padding:6px}button,select{padding:6px}output{height:100px;overflow:auto;font:11px monospace;overflow-wrap:anywhere}canvas{flex:1;min-height:0;width:100%}</style><nav>位置/任务6/无敌人fixture，无存档 <select id="scenario"><option value="approach">石碑前方</option><option value="support">走向拱柱</option><option value="opening">穿过拱门</option></select><select id="clock"><option value="240">正午</option><option value="0">午夜</option></select><button id="walk" disabled>前行90帧</button><button id="read" disabled>读取石碑</button></nav><output>准备生产场景…</output><canvas></canvas><script type="module">
import {WorldView} from '../src/scene.js';import {createWorld,terrain,LANDMARKS} from '../src/world.js';import {freshGame,movePlayer,tick,nearest,interact} from '../src/game.js';const world=createWorld(),o=LANDMARKS.find(o=>o.type==='ruin'),view=new WorldView(document.querySelector('canvas'),world),out=document.querySelector('output'),walk=document.querySelector('#walk'),read=document.querySelector('#read');let state,frames=0,message='';
function draw(){view.draw(state,nearest(state,world.objects),null,frames>0,1/60);out.textContent=JSON.stringify({scenario:document.querySelector('#scenario').value,clock:state.time,frames,player:[state.player.x,state.player.z],message,near:nearest(state,world.objects)?.id,boxes:view.cameraObstacles.find(e=>e.object===o)?.boxes.length,glError:view.renderer.getContext().getError(),viewport:[innerWidth,innerHeight],calls:view.renderer.info.render.calls,triangles:view.renderer.info.render.triangles,scope:'Explicit position/q6/no-enemy fixture; production movement/camera and stone reading; no ordinary save or native movement proof.'});}
function reset(){state=freshGame();state.enemies=[];state.quest=6;state.time=Number(document.querySelector('#clock').value);frames=0;message='';const scenario=document.querySelector('#scenario').value;Object.assign(state.player,{x:o.x+(scenario==='support'?-3.2:0),z:o.z+(scenario==='approach'?5:scenario==='support'?0:-7),yaw:Math.PI});view.sync(state);view.yaw=scenario==='approach'?.05:Math.PI;view.pitch=.4;view.distance=17;view.camera.position.set(state.player.x+Math.sin(view.yaw)*17,terrain(state.player.x,state.player.z)+9,state.player.z+Math.cos(view.yaw)*17);draw();}
walk.onclick=()=>{walk.disabled=read.disabled=true;function step(){movePlayer(state,world.objects,0,document.querySelector('#scenario').value==='support'?-1:1,1/60);tick(state,1/60,false,null,world.objects);frames++;draw();if(frames<90)requestAnimationFrame(step);else walk.disabled=read.disabled=false;}requestAnimationFrame(step);};read.onclick=()=>{message=interact(state,nearest(state,world.objects));draw();};document.querySelectorAll('select').forEach(e=>e.onchange=reset);Promise.all([view.groundSurface.userData.ground.loaded,view.groundSurface.userData.ground.sand.loaded,view.rockSurface.userData.rock.loaded]).then(()=>{reset();walk.disabled=read.disabled=false;});window.addEventListener('resize',()=>{view.resize();if(state)draw();});
</script></html>

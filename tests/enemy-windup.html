<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>敌人前摇与命中定格</title><style>html,body{margin:0;height:100%;background:#192723;color:#efe6cf;font:13px system-ui}body{display:flex;flex-direction:column}nav{padding:6px}button,select{padding:6px}output{height:100px;overflow:auto;font:11px monospace;overflow-wrap:anywhere}canvas{flex:1;min-height:0;width:100%}</style><nav>显式敌人/位置 fixture · 固定 dt · 无存档 <select id="type"><option>boar</option><option>crab</option></select><select id="phase"><option>warning</option><option>impact</option><option>dodge</option><option>cancel</option><option>defeated</option></select><button id="run" disabled>定格检查</button></nav><output>准备场景</output><canvas></canvas><script type="module">
import {WorldView} from '../src/scene.js';import {createWorld,terrain} from '../src/world.js';import {freshGame,tick,enemyAttackPose,cancelEnemyAttacks} from '../src/game.js';
const world=createWorld(),view=new WorldView(document.querySelector('canvas'),world),out=document.querySelector('output'),run=document.querySelector('#run');let state;
function review(){const type=document.querySelector('#type').value,phase=document.querySelector('#phase').value;state=freshGame();state.time=240;state.quest=6;state.enemies=[{id:'warning-fixture',type,x:-70,z:104.55,hp:70,attackAt:-100}];Object.assign(state.player,{x:-70,z:102,yaw:0});const e=state.enemies[0],events=[],feedback={};tick(state,.01,false,feedback,world.objects);events.push({...feedback});view.sync(state);view.draw(state,null,null,false,1/60);
 if(phase==='dodge')state.player.z-=5;if(phase==='cancel')cancelEnemyAttacks(state);if(phase==='defeated')e.hp=0;
 const duration=phase==='warning'?.299:.301;for(let elapsed=0;elapsed<duration-1e-9;){const dt=Math.min(1/60,duration-elapsed);tick(state,dt,false,feedback,world.objects);if(feedback.damage)events.push({...feedback});view.sync(state);view.draw(state,null,null,false,dt);elapsed+=dt;}events.push({...feedback});
 const h=terrain(state.player.x,state.player.z);view.camera.position.set(-63,h+5,95);view.camera.lookAt(-70,h+1.2,104);view.sky.position.copy(view.camera.position);view.renderer.render(view.scene,view.camera);
 out.textContent=JSON.stringify({type,phase,hp:state.player.hp,enemyHp:e.hp,pose:enemyAttackPose(state,e),bodyOffset:view.creatures.get(e.id)?.userData.body.position.z,events,glError:view.renderer.getContext().getError(),viewport:[innerWidth,innerHeight],scope:'Explicit fixed-dt production tick and WorldView; no ordinary-save, native movement, sound listening or performance claim.'});}
run.onclick=review;Promise.all([view.groundSurface.userData.ground.loaded,view.groundSurface.userData.ground.sand.loaded,view.rockSurface.userData.rock.loaded]).then(()=>{run.disabled=false;review();});window.addEventListener('resize',()=>{view.resize();if(state)review();});
</script></html>

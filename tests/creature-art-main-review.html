<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>生物整体表面与生产交战检视</title>
<style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{overflow:hidden}#result{position:fixed;left:0;top:0;max-width:420px;max-height:115px;overflow:auto;background:#fff;color:#111;font:10px monospace;z-index:100;pointer-events:none}</style>
<output id="result">准备标注fixture…</output><iframe title="生产游戏反馈隔离验收"></iframe><script type="module">
const mode=new URL(location.href).searchParams.get('mode')??'combat';if(!['combat','boar','miss'].includes(mode))throw Error('Unknown feedback fixture');
const response=await fetch('../index.html',{cache:'no-store'});if(!response.ok)throw Error('index HTTP '+response.status);
const doc=new DOMParser().parseFromString(await response.text(),'text/html'),base=doc.createElement('base');base.href=new URL('../',location.href).href;doc.head.prepend(base);doc.body.dataset.testHarness='true';for(const script of doc.querySelectorAll('script'))script.remove();
// Keep the actual pause UI visible, off the central actor in desktop inspection shots.
const style=doc.createElement('style');style.textContent='#panel{margin-right:12px;max-width:300px}#panel::backdrop{backdrop-filter:none!important;background:transparent!important}@media(max-width:500px){#panel{margin-top:12px;max-height:130px;overflow:auto}}';doc.head.append(style);
const setup=doc.createElement('script');setup.type='module';setup.textContent=`
import {boot} from './src/main.js';import {freshGame,nearest} from './src/game.js';import {createWorld,terrain} from './src/world.js';import {resourceHalfSize} from './src/resource-contact.js';import {WorldView} from './src/scene.js';import {GameAudio} from './src/audio.js';
const sourceFiles=['src/creature.js','src/creature-surface.js','src/main.js','src/scene.js','src/impact-feedback.js','src/authored-character.js','assets/characters/action-landmarks.json'],sources=Object.fromEntries(await Promise.all(sourceFiles.map(async path=>{const b=await(await fetch('./'+path,{cache:'no-store'})).arrayBuffer(),digest=await crypto.subtle.digest('SHA-256',b);return [path,Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('')];})));
const mode=${JSON.stringify(mode)},scenario=new URL(parent.location.href).searchParams.get('scenario')??'attack',weapon=new URL(parent.location.href).searchParams.get('weapon')??'sword',state=freshGame(),world=createWorld(),events=[],sounds=[];let viewRef=null,audioRef=null,autoPaused=false,frames=0;const poses=[];
state.quest=6;state.time=240;state.inventory.axe=state.inventory.sword=1;state.selected=weapon;state.enemies.forEach(e=>e.hp=0);
let target=null;
if(['stone','fiber'].includes(mode)){
 const candidates=world.objects.filter(o=>o.type===mode&&terrain(o.x,o.z)>2).sort((a,b)=>Math.hypot(a.x-136,a.z+22)-Math.hypot(b.x-136,b.z+22));
 for(const object of candidates){const x=object.x,z=object.z+resourceHalfSize(object)+1;if(terrain(x,z)<.2)continue;Object.assign(state.player,{x,z,yaw:Math.PI});if(nearest(state,world.objects)?.id===object.id){target=object;break;}}
 if(!target)throw Error('No reachable real resource for fixture');
}else{target=state.enemies.find(e=>e.type===(mode==='boar'?'boar':'crab'));Object.assign(target,{hp:mode==='miss'?0:40,x:state.player.x+2.6,z:state.player.z,attackAt:state.time});state.player.yaw=Math.PI/2;}
const effect=GameAudio.prototype.effect;GameAudio.prototype.effect=function(kind,options){audioRef=this;const before=this.sources.size;effect.call(this,kind,options);if(['gather','swing','hit'].includes(kind))sounds.push({kind,time:state.time,before,after:this.sources.size,context:this.context?.state});};
function report(){parent.document.querySelector('#result').textContent=JSON.stringify({fixture:mode,sources,target:{id:target.id,type:target.type,x:target.x,z:target.z},events,sounds,frames,poses,scenario,weapon,hurtSource:viewRef?.player.userData.hurtSource??null,actionSource:viewRef?.player.userData.actionSource??null,paused:document.querySelector('#panel').open,time:state.time,hp:state.player.hp,inventory:state.inventory,kills:state.kills,targetHp:target.hp??null,targetTextured:!!viewRef?.creatures.get(target.id)?.userData.hide.map,poolActive:viewRef?.impacts.active??0,plan:viewRef?.player.userData.plan??null,authored:viewRef?.player.userData.authored??false,render:viewRef?{calls:viewRef.renderer.info.render.calls,triangles:viewRef.renderer.info.render.triangles,geometries:viewRef.renderer.info.memory.geometries,textures:viewRef.renderer.info.memory.textures}:null,glError:viewRef?.renderer.getContext().getError()??null,viewport:[innerWidth,innerHeight],scope:'Production native start/space/AI/main tick/resolve/draw/audio. Declared quest6/sword+axe and nearby one crab/boar, other enemies disabled; isolated key. Auto-pause through real UI at confirmed hit or .1seconds after real damage. Full-body source pose, not blade/mesh collision, ordinary campaign, audition/device/final quality.'});}
const draw=WorldView.prototype.draw;WorldView.prototype.draw=function(s,...args){
 if(!viewRef){viewRef=this;const spawn=this.impacts.spawn;this.impacts.spawn=cue=>{events.push({cue:{...cue},time:state.time,hp:state.player.hp,targetHp:target.hp??null,inventory:{...state.inventory},kills:state.kills});return spawn(cue);};}
 draw.call(this,s,...args);frames++;const rig=this.player.userData;if((rig.plan?.action||rig.plan?.recoil>0)&&poses.length<90&&poses.at(-1)?.time!==state.time)poses.push({time:state.time,action:rig.actionSource,hurt:rig.hurtSource,pelvis:this.player.getObjectByName('pelvis').matrixWorld.elements.slice(12,15),pelvisRotation:this.player.getObjectByName('pelvis').quaternion.toArray(),player:{...state.player},feet:rig.worldFeet.map(p=>p.toArray())});
 if(!autoPaused&&((scenario==='attack'&&events.length)||(scenario==='hurt'&&state.player.hp<100&&state.time-this.hurtAt>=.1)||(mode==='miss'&&state.attackAt>240&&state.time-state.attackAt>.5))){autoPaused=true;queueMicrotask(()=>document.querySelector('#pause-button').click());}
 report();};
boot({initialState:state,storageKey:'tidelands-qa-creature-art-'+mode+'-'+weapon+'-'+scenario});
`;doc.body.append(setup);document.querySelector('iframe').srcdoc='<!doctype html>'+doc.documentElement.outerHTML;
</script></html>
